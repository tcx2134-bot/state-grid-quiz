d":"hv-c4-single-20","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":20,"page":38,"text":"关于氧化锌避雷器的电压比描述正确的是 （\n扫描全能王\n3 亿人都在用的归韉 App\nA 电压比是氧化锌避雷器在标称放电电流 （ 8 / 20 ） 下的残压与持续运行电压峰值之比\nB ． 压比越小 ， 表示非线性越好\nC 珏比越小 ， 保护性能越差\nD ， 电压比一般约为 2 ， 6 、 3 ． 8","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-21","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":21,"page":39,"text":"氧化锌避雷器具有以下优点 （\nA ． 耐污性能好\nB 洧续流\nC ． 能制成轻载避雷器\nD ． 有间隙","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-22","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":22,"page":39,"text":"交流无间隙金属氧化物避雷器在通过直流 1 mA 参考电流时 ， 测得的避雷器端子间的直\n流电压平均值称为该避雷器的 （\nA ． 直流 1 mA 参考电压\nB ． 工频参考电压\nC ， 额定电压\nD ． 持续运行电压","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-23","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":23,"page":39,"text":"允许持久地施加在交流无间隙金属氧化物避雷器端子间的工频电压有效值称为该避雷\nA ． 额定电压的峰值与参考电压之比\nB ． 持续运行电压\nC ． 工频参考电压\nD ． 允许运行电压","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-24","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":24,"page":39,"text":"雷击线路时 ， 线路绝缘不发生闪络的最大雷电流輻值称为 （\nA ． 地面落雷密度\nB ． 耐雷水平\nC ． 雷击跳闸率\nD ． 击杆率","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-25","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":25,"page":39,"text":"山区线路绕击率约为平原线路的 （\nC.4\nD.3","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-26","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":26,"page":39,"text":"变电站进线段的耐雷水平比其他部分线路的耐 "high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":60,"page":42,"text":"保护间隙与被保护绝缘并联 ， 且前者的击穿电压要比后者 （\nA. 低\nB. 高\nC 湘同\n） ， GB 仃 50064 · 2014 规定标准雷暴日\nD ． 没有要求","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-61","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":61,"page":42,"text":"每年 、 每平方公里的地面落雷次数称为 （\n40 天建议取值为 （\nA ． 地面落雷密度 ， 2 ． 78 次 / （ 2 ． 年 ）\nB ． 地面落雷密度 ， 0 ． 07 次 ／ 年 ）\nC ， 雷击跳闸率 ， 2 ， 78 次 / （ 2 ． 年 ）\nD ， 雷击跳闸率 ， 0 ． 07 次 / （ 2 ． 年 ）","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-62","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":62,"page":42,"text":"接地装置按工作特点可分为工作接地 、 保护接地和防雷接地 。 保护接地的电阻值对高\n压设备约为 （\nA ． 0 ． 5 ～ 5Q\nB.I ～ 1 OQ\nC ． 10 ～ 100Q\nD ． 小于 IQ","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-63","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":63,"page":42,"text":"一般情况下避雷针和配电构架间的空气间隙不应小于 （\n扫描全能王\n3 亿人都在用的归韉 App\nA.3m\nB.4m\nC.5m\nD.6m","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-64","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":64,"page":43,"text":"以下阀型避雷器中 ， 保护旋转电机用的避雷器型号是 （\nA.FZ 型\nB.FS 型\nC.FCD 型\nD.FDC 型","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-65","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":65,"page":43,"text":"冲击电流流过避雷器阀片 ， 阀片上的电压是 （\nA ． 额定电压\nB ． 残压\nC 江频参考电压\nD ， 最大长期工作电压","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-single-66","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"single","typeLabel":"单选题","number":66,"page":43,"text":"一般仅适用于输电线路的绝缘弱点 、 变电所发电厂的进线段保护的避雷器是 （\nA ． 保护间隙\nB ． 管式避雷器\nC ， 阀式避雷器\nD ． 磁吹避雷器","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-1","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":1,"page":43,"text":"表示某地区雷电活动频繁程度的主要指标是 （\nA ． 耐雷水平\nB ， 雷暴日\nC ． 雷击跳闸率\nD ． 雷暴小时","answer":"BD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-2","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":2,"page":43,"text":"关于雷电放电及其参数说法正确的是 （\nA ． 国内外实测统计结果表明 ， 75 ％ 0 ％ 的雷电流是负极性的\nB ． 负极性雷电击中导线后产生负极性冲击电晕 ， 不如正极性冲击电晕强烈\nC ， 与正极性冲击电晕相比 ， 负极性冲击电晕对设备绝缘不利\nD ， 线路的防雷保护一般均以负极性雷电为准","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-3","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":3,"page":43,"text":"接地按其作用可以分为 （\nA ． 防雷接地\nB ． 保护接地\nC ． 工作接地\nD ． 防静电接地","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-4","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":4,"page":43,"text":"关于避雷针和避雷线保护范围说法正确的是 （\nA ． 单根避雷针 （ 针高小于等于 30 米 ） 的保护角为 45 度\nB ， 单根避雷线 （ 线高小于等于 30 米 ） 的保护角为 25 度\nC ． 当避雷针高度超过 30 米时 ， 其高度修正系数大于 1\nD ， 当避雷针高度低于 30 米时 ， 其高度修正系数大于 1","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-5","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":5,"page":43,"text":"避雷线的作用是 （\nA ． 避雷线可以防止雷电直击导线 。 避雷线可以降低导线上的感应过电压\nB ． 避雷线有分流作用 ， 可以减小流经杆塔人地的雷电流 ， 从而降低塔顶电位\nC ． 避雷线对导线的耦合作用可以降低绝缘子串上的电位\nD ． 避雷线的作用原理与避雷针相同 ， 主要用于输电线路保护 ， 超高压以上变电所也可以采\n用避雷线来保护","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-6","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":6,"page":43,"text":"用来模拟电力系统中的雷电过电压可以采用的波形有 （\n扫描全能王\n3 亿人都在用的归韉 App\nA ． 斜角波\nB ． 非周期性双指数波\nC ． 斜角平顶波\nD ． 半余弦波","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-7","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":7,"page":44,"text":"关于防雷接地的表述 ， 正确的是 （\nA ， 接地电阻主要是接地体的电阻\nB ． 冲击接地电阻应小于 30Q\nC ， 冲击接地电阻的大小与火花效应或电感效应有关\nD ． 接地装置一般是由接地线和接地体组成","answer":"BCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-8","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":8,"page":44,"text":"雷电放电过程中先导放电阶段的特点是 （\nA ， 具有连续性\nB ， 历时约 0 ． 005 ～ 0 ， 010s\nC ． 先导发展方向是从大地向雷云方向发展\nD ． 发展速度约为光速的 1 / 1000","answer":"BD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-9","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":9,"page":44,"text":"雷电放电过程中主放电阶段的特点是 （\nA ． 持续时间大约 50 ～ 100 斡\nB ． 主放电时电流最大可达数百千安\nC ． 移动速度为光速的 1 / 20 ～ 1 / 2\nD ． 沿着先导通道由下向上逆向发展 ， 故又称 “ 回击 ”","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-10","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":10,"page":44,"text":"关于雷电放电过程中余辉放电阶段 ， 说法正确的是 （\nA ． 雷云中剩下的电荷继续沿主放电通道下移 ， 称为余辉放电阶段\nB 涂辉放电电流比主放电电流大\nC ， 持续时间比主放电时间长\nD ． 在余辉阶段中流过较长时间的电流是造成雷电热效应的重要因素","answer":"ACD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-11","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":11,"page":44,"text":"氧化锌避雷器的残压包括 （\nA · 陡波冲击放电电流 （ ] / 10 ） 下的残压 B ． 标称冲击放电电流 （ 8 / 20 ） 下的残压\nC ． 操作冲击放电电流 （ 30 / 60 ） 下的残压 D ， 雷电冲击放电电流 （ 2 ． 6 巧 0 斡 ） 下的残压","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-12","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":12,"page":44,"text":"对于输电线路感应过电压 ， 描述正确的是 （\nA ． 对于 35kV 及以下线路 ， 可能会使线路绝缘发生闪络\nB ． 避雷线对导线的耦合系数越大 ， 感应过电压越小\nC 哙引起相间闪络\nD. 对 1 10kV 及以上等级线路威胁大","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-13","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":13,"page":44,"text":"关于雷电参数 ， 以下说法正确的是 （\nA ． 地面落雷密度指的是每一个雷暴日 ， 每平方米对地面落雷次数\nB ． 雷电通道如同一个导体 ， 雷电流在导体中流动 ， 对电流波呈现一定的阻抗 ， 该阻抗叫做\n雷电通道波阻抗\nC ， 雷电流是指雷击于不接地的物体时 ， 流过该物体的电流\nD ． 雷电流陡度是指雷电流随时间上升的速度 ， 对于斜角平顶波 ， 陡度与雷电流幅值 1 有线\n性的关系 ， 即幅值愈大 ， 陡度也愈大\n） 两个分量 。","answer":"BD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-14","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":14,"page":44,"text":"当雷击线路附近地面时 ， 线路的导线上会出现感应雷过电压 ， 包括 （\n扫描全能王\n3 亿人都在用的归韉 App\n微佶公众号 ： 衡真\nA ． 静电感应\nB ， 电磁感应\nC ． 反击分量\nD ． 绕击分量","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-15","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":15,"page":45,"text":"关于两根等高避雷针的保护范围 ， 说法正确的是 （\nA ， 保护范围是两个单根针保护范围的叠加 B ， 两针外侧的保护范围会扩大\nC ， 两针之间的保护范围比单针保护范围扩大 D ， 两针之间的距离不能太大","answer":"CD","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c4-multi-16","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":16,"page":45,"text":"关于避雷针说法正确的是 （\nA ． 在避雷针保护范围内的设备也有可能遭受雷击\nB 沩了使雷电流顺利地泄人大地 ， 故要求避雷针 （ 线 ） 应有良好的接地装置\nC ． 避雷针的保护范围 （ 保护效能 ） 是指被保护物体在此空间范围内一定不会遭受雷击\nD ． 被保护设备全面位于避雷针 〈 线 ） 的保护范围内 ， 与被保护物之间的距离越近保护效果\n越好","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-17","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":17,"page":45,"text":"我国使用的避雷针的保护范围的计算方法有 （\nA ． 根据小电流雷电冲击模拟试验确定 ， 并根据多年运行经验进行了校验\nB ． 保护范围是按照保护概率 99 ， 9 ％ 确定的空间范围 （ 即屏蔽失效率或绕击率 0 ． 1 ％ ）\nC ． 发电厂 、 变电站采用多针联合保护时可以用折线法\nD ． 建筑物 、 信息系统中多用滚球法","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-18","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":18,"page":45,"text":"阀型避雷器对变电站设备进行保护时 ， 以下正确的是 （\nA ． 避雷器的残压高于被保护设备的冲击电气强度\nB 避雷器的残压低于被保护设备的冲击电气强度\nC ． 伏秒特性曲线低于被保护设备的伏秒特性曲线\nD ， 伏秒特性曲线高于被保护设备的伏秒特性曲线","answer":"BC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-19","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":19,"page":45,"text":"关于避雷器以下说法正确的是 （\nA ． 保护间隙是一种简单的避雷器 ， 结构简单 、 价廉 、 维修方便 ， 保护效果差 ， 灭弧能力强\nB ． 排气式避雷器有较高的灭弧能力 ， 但伏秒特性陡 ， 放电分散性大 ， 与被保护设备的绝缘\n配合不理想 ； 动作后产生截波 ， 放电特性受大气条件影响 ， 它主要用作保护线路弱绝缘 ，\n以及电站的进线保护段\nC ． 阀式避雷器由装在密封瓷套中的多组火花间隙和多组非线性电阻阀片串联组成 。 它分普\n通型和磁吹型两大类\nD ． 阀式避雷器从间隙击穿到工频续流被切断不超过半个周波 ， 因此电网在整个过程均保持\n正常供电","answer":"BCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-20","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":20,"page":45,"text":"关于氧化锌避雷器说法正确的是 （\nA ． 氧化锌避雷器的额定电压是避雷器两端之间允许施加的最大工频电压峰值\nB ， 系统短时工频过电压直接加在氧化锌阀片上时 ， 避雷器仍允许吸收规定的雷电及操作过\n电压能量 ， 特性基本不变 ， 不会发生热击穿\nC ． 氧化锌避雷器额定电压与碳化硅避雷器的灭弧电压相对应 ， 含义相同\nD ． 氧化锌避雷器额定电压是与热负载有关的量 ， 是决定避雷器各种特性的基准参数\n扫描全能王\n3 亿人都在用的归韉 App","answer":"BD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-21","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":21,"page":46,"text":"避雷器的保护原理是 （\nA ． 与被保护的电气设备串联连接\nB ． 实质上是一种过电压限制器\nC ， 是专门用以限制线路传来的雷电过电压或操作过电压的一种防雷装置\nD ． 过电压作用时 ， 避雷器先于被保护电力设备放电 ， 由两者的全伏秒特性的配合来保证","answer":"BCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-22","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":22,"page":46,"text":"金属氧化物避雷器 （ MOA ） 的优点有 （\nA ． 非线性系数值很大 ， 在额定电压作用下 ， 通过的电流极小 ， 因此可以做成无间隙避雷器\nB ． 不需间隙动作 ， 电压一旦升高 ， 即可迅速吸收过电压能量 ， 抑制过电压的发展 ， 保护性\n能好\nC ， 金属氧化物避雷器基本无续流 ， 动作负载重 ， 耐重复动作能力强\nD ． 通流容量比碳化硅避雷器大","answer":"BD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-23","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":23,"page":46,"text":"以下能提高输电线路耐雷水平的措施是 〈\nA ． 采用不平衡绝缘\nB ． 增加绝缘子片数\nC ． 增大避雷线的保护角\nD ， 架设耦合地线","answer":"BD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-24","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":24,"page":46,"text":"关于输电线路的避雷线 ， 说法正确的是 （\nA.110kV 线路沿全线架设地线 ， 在山区和强雷区宜架设双地线\nB.110kV 线路不需全线架设地线 ， 在山区和强雷区可架设单地线\nC 少雷区除外的其他地区的 220kV ～ 750kV 线路应沿全线架设双地线\nD.110kV 线路在多雷区可不沿全线架设地线 ， 但应装设自动重合闸装置","answer":"AC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-25","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":25,"page":46,"text":"线路的防雷性能指标有 （\nA ． 耐雷水平\nB ． 雷击跳闸率\nC ， 雷电活动强度\nD ． 雷暴日和雷暴小时","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-26","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":26,"page":46,"text":"引起输电线路雷击跳闸需要满足的条件是 （\nA ． 雷电流超过线路耐雷水平 ， 引起线路绝缘冲击闪络\nB ． 短暂雷电波过去后 ， 冲击闪络转变为稳定工频电弧 ， 导线上将产生工频短路电流 ， 造成\n线路跳闸停电\nC ， 雷电流不超过线路耐雷水平\nD ． 冲击闪络不需要转变为稳定工频电弧","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-27","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":27,"page":46,"text":"变电站的雷害来源有 （\nA ． 直击雷过电压\nB ． 侵人雷过电压\nC ． 暂态过电压\nD ， 操作过电压","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-28","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":28,"page":46,"text":"避雷器能够保护设备必须满足 （\nA ． 它的伏秒特性与被保护绝缘的伏秒特性有良好的配合\nB ． 它的伏安特性应保证其残压低于被保护绝缘的冲击电气强度\nC ． 被保护绝缘必须处于该避雷器的保护距离之内\nD ． 被保护绝缘可以离避雷器任意远\n扫描全能王\n3 亿人都在用的归韉 App","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-29","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":29,"page":47,"text":"当雷电人侵时 ， 为了保证设备的安全 ， 需采取的措施是 （\nA ， 限制通过避雷器的冲击雷电流\nB ． 限制雷电流陡度\nC 尽量缩短避雷器与被保护设备间的电气距离\nD ． 提高避雷器残压可以更好地保护绝缘","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-30","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":30,"page":47,"text":"变电站内安装避雷器的原则是 （\nA ． 一般变电站对于雷电波的侵人波保护设计主要是采用避雷器 ， 重点在于选择避雷器的安\n装位置\nB ． 在任何运行方式下 ， 均不能超过最大电气距离\nC ． 避雷器一般装设在母线上 ， 一组或者多组\nD ， 避雷器具体安装点选择原则是 “ 确保重点 、 兼顾一般 \" 。 应尽可能把阀式避雷器装得离主\n变压器近一些","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-31","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":31,"page":47,"text":"进线保护段的作用体现在 〈\nA ． 雷电过电压波在流过进线段时 ， 将因冲击电晕而发生衰减和变形降低了波前陡度和幅\n值\nB ． 限制了流过避雷器的冲击电流幅值\nC ． 雷电过电压波在流过进线段时 ， 提高了波前陡度和幅值\nD ． 提高了流过避雷器的冲击电流幅值","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-32","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":32,"page":47,"text":"保护间隙的缺点为 （\nA ． 保护间隙的伏秒特性曲线很陡 ， 难以与被保护绝缘的伏秒特性取得良好配合\nB ． 保护间隙没有专门的灭弧装置\nC ． 会产生大幅值的截波 ， 对变压器绝缘不利\nD ． 为了防止主间隙被外物短接而引起误动作 ， 下方串接了一个辅助间隙","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-33","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":33,"page":47,"text":"关于两支不等高避雷针的保护范围 ， 说法正确的是 （\nA ． 两根针外侧保护范围确定方法与单针相同\nB ， 确定保护范围时 ， 需要按照高针的高度 ， 找到一支假想的避雷针\nC ． 确定保护范围时 ， 要按照低针的高度 ， 找到一支假想的避雷针\nD ， 两针内侧保护范围会缩小","answer":"AC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-34","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":34,"page":47,"text":"线路的落雷次数的影响因素 ， 以下描述正确的是 （\nA ． 地面落雷密度越大 ， 线路的落雷次数越多 B · 杆塔高度越大 ， 线路的落雷次数越多\nC ， 避雷线的间距越大 ， 线路的落雷次数越多 D ， 线路的落雷次数与保护角成正比","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-35","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":35,"page":47,"text":"下列关于管式避雷器说法正确的是 （\nA ． 火花间隙是不均匀电场 ， 存在极性效应 B ． 灭弧有工频续流\nC ． 工频续流大小不影响避雷器选择\nD ． 适用于发电厂进线段保护","answer":"ABD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-36","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":36,"page":47,"text":"在同一电压等级的电气设备中 ， 以旋转电机的冲击电气强度最低 ， 是因为 （\nA ． 电机只能采用固体绝缘 ， 不能采用固一液组合绝缘 ， 绝缘水平低\n扫描全能王\n3 亿人都在用的归韉 App\nB ， 制造过程中电机绝缘容易受到损伤 ， 易发生局部放电\nC ， 绝缘运行条件严酷 ， 受热 、 机械振动 、 潮气 、 污秽 、 电气应力等因素联合作用\nD ． 绝缘结构不均匀 ， 冲击系数低于 1","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-multi-37","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"multi","typeLabel":"多选题","number":37,"page":48,"text":"气体绝缘变电所的防雷保护特点有 （\nA.GIS 绝缘伏秒特性很平坦 ， 冲击系数接近 1 ， 绝缘水平主要取决于雷电冲击水平\nB.GIS 结构紧凑 ， 设备间电气距离短 ， 被保护设备与避雷器较近 ， 比常规变电站有利\nC.GIS 中同轴母线筒波阻抗大于 1000 ， 对变电站波防护有利\nD.GIS 内的绝缘大多为稍不均匀电场结构 ， 一旦电晕 ， 不会立即导致击穿","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-1","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":1,"page":48,"text":"雷电放电的主放电通道波阻抗与雷电流大小无关 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-2","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":2,"page":48,"text":"保护角指避雷线和边相导线的连线与经过避雷线的铅垂线之间的夹角 。 保护角越大 ， 避\n雷线对导线的屏蔽保护作用越有效 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-3","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":3,"page":48,"text":"变电所的防雷保护主要依靠管式避雷器 ， 它在电力系统过电压保护和绝缘配合中都起着\n重要作用 。 它的保护特性是选择高压电力设备绝缘水平的基础 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-4","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":4,"page":48,"text":"线路绝缘的耐雷水平越高 ， 越容易闪络 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-5","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":5,"page":48,"text":"落雷密度是指每雷暴日中每平方公里地面内平均落雷的次数 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-6","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":6,"page":48,"text":"埋人地中的金属接地体称为接地装置 ， 其作用是增大接地电阻 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-7","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":7,"page":48,"text":"负下行雷通常包含若干次的重复放电 ， 每一个过程包括先导 、 主放电和余辉 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-8","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":8,"page":48,"text":"降低杆塔接地电阻是提高线路耐雷水平防止绕击的有效措施 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-9","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":9,"page":48,"text":"一天中只要有雷电活动 ． 了作一个雷暴日 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-10","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":10,"page":48,"text":"线路的雷击跳闸率包括绕击跳闸率和反击跳闸率 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-11","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":11,"page":48,"text":"雷电流是雷击低接地电阻被击物时流过被击物的电流 ， 雷电流幅值与气象 、 自然条件\n等有关 ， 并且有一定的概率分布规律 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-12","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":12,"page":48,"text":"氧化锌避雷器由火花间隙和阀片两部分组成 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-13","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":13,"page":48,"text":"进线段保护的主要作用是限制来波的陡度 ， 同时使流过避雷器 （ 330kV 以下 ） 的电流\n不超过 5 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-14","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":14,"page":48,"text":"我国 35kV ～ 220kV 电网的电气设备绝缘水平是以避雷器 10 下的残压作为绝缘配合\n的设计依据 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-15","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":15,"page":48,"text":"避雷器的残压是指雷电流通过避雷器时在电阻阀片上产生的压降 ， 在防雷设计中通常\n以 5 以上的残压为避雷器的最大残压 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c4-judge-16","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":16,"page":48,"text":"避雷针架设在配电装置构架上时 ， 避雷针与主接地网的地下连接点到变压器接地线与\n主接地网的地下连接点之间的距离不得小于 5mo （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-17","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":17,"page":48,"text":"对于雷云 ， 距地面到月高度主要是带正电荷的云层 ， 距地面 1-5km 高度主要是带负\n电荷的云层 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-18","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":18,"page":48,"text":"8 、 三相线路的塔顶遭受雷击时 ， 若导线与避雷线之间的耦合系数越大 ， 越易发生闪络 。\n扫描全能王\n3 亿人都在用的归韉 App","answer":"B","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c4-judge-19","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":19,"page":49,"text":"雷击大地时 ， 在导线上产生的感应过电压的极性与雷电的极性相同 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-20","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":20,"page":49,"text":"当单根接地体的接地电阻 R 不符合要求时 ， 可采用多根 （ n 根 ） 垂直接地体并联 ， 并\n联后接地电阻为 R/no （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-21","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":21,"page":49,"text":"发电厂和变电所的直击雷过电压保护可采用避雷针或避雷器 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-22","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":22,"page":49,"text":"碳化硅阀型避雷器主要由阀片构成 ， 没有间隙 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-23","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":23,"page":49,"text":"输电线路保护角越小 ， 绕击率越大 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-24","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":24,"page":49,"text":"残压为避雷器流过工频续流时 ， 在避雷器阀片上产生的压降 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-25","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":25,"page":49,"text":"从防雷保护的角度来说 ， 输电线路上避雷线的保护角越小越好 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-26","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":26,"page":49,"text":"直配电机的防雷比非直配电机更容易 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-27","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":27,"page":49,"text":"杆塔高度增加 ， 绕击率将降低 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-28","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":28,"page":49,"text":"实测表明对地放电的雷云绝大部分带有正电荷 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-29","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":29,"page":49,"text":"防止雷直击于变电站 ， 只可以装设避雷针来保护 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-30","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":30,"page":49,"text":"雷电放电现象可用汤逊放电理论加以解释 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-31","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":31,"page":49,"text":"1 、 雷电流超过了线路耐雷水平 ， 就一定会引起线路跳闸 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-32","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":32,"page":49,"text":"耐雷水平 （ 单位 ： ） 是指雷击线路时线路绝缘不发生闪络的最小雷电流幅值 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-33","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":33,"page":49,"text":"雷击跳闸率是指折算为统一的条件下 ， 因雷击而引起的线路跳闸的次数 （ 每年 40 个雷\n暴日 、 1 线路长度 ） 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-34","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":34,"page":49,"text":"线路全线装设避雷线 ， 并使三相线路处于其保护范围之内 ， 将不存在绕击雷 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-35","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":35,"page":49,"text":"输电线路防雷的任务是采用技术上与经济上的合理措施 ， 使系统雷害降低到运行部门\n能够接受的程度 ， 保证系统安全可靠运行 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-36","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":36,"page":49,"text":"只有当冲击闪络后的闪络通道发展成稳定的工频电弧时 ， 才会导致线路跳闸 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-37","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":37,"page":49,"text":"被保护设备离避雷器越远 ， 设备上电压高出避雷器电压就越低 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-38","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":38,"page":49,"text":"变电站大型接地网的面积越大 ， 接地网的接地电阻越小 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-39","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":39,"page":49,"text":"110kV 及以下配电装置 ， 不易反击 ， 容许装设构架避雷针 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-40","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":40,"page":49,"text":"避雷器至主变的最大电气距离随着变电站架空出线回路数增加而减小 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-41","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":41,"page":49,"text":"全高超过 40m 有避雷线的杆塔 ， 每增高 10m ， 应增加一个绝缘子 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-42","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":42,"page":49,"text":"避雷器具有一定的保护范围 ， 最大允许距离与侵人波陡度 a 成正比 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-43","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":43,"page":49,"text":"所谓进线段保护可以降低侵人波的幅值和陡度 ， 使避雷器可靠动作 ， 减小反击和绕击\n的概率 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-44","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":44,"page":49,"text":"超高压输电线路防雷措施最普遍使用的是避雷器 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-45","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":45,"page":49,"text":"若 n 根垂直接地体并联 ， 则总接地电阻等于单根接地体接地电阻的 l/no （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-46","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":46,"page":49,"text":"GIS 波阻抗较架空线小 ， 来自于输电线路的人侵波到了 GIS ， 幅值将降低 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-47","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":47,"page":49,"text":"防止雷击塔顶或避雷线后引起绝缘闪络的措施是增加绝缘片子 、 采用不接地或经消弧\n线圈接地 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-48","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":48,"page":49,"text":"工频接地电阻为 Rg 的接地装置受到冲击电流作用时 ， 接地电阻冲击系数一般将小于 1 。\n扫描全能王\n3 亿人都在用的归韉 App","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-49","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":49,"page":50,"text":"接地体本身电感的影响使得冲击接地电阻减小 。 接地体周围的火花区相当于增大了接\n地体的有效尺寸 ， 因而使冲击接地电阻增大 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-50","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":50,"page":50,"text":"为了防止反击 ， 一般规程要求避雷针与被保护设备在空气中的距离大于 3 米 。 〈","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-51","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":51,"page":50,"text":"用避雷针 、 避雷带 、 避雷器是防止雷破坏建筑物的主要措施 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-52","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":52,"page":50,"text":"直击雷是输电线路和变电所遭受雷害的主要原因 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-53","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":53,"page":50,"text":"随电压等级增加 ， 内部过电压幅值有明显增大的趋势 ， 雷电过电压变化则相对较小 。","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-54","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":54,"page":50,"text":"接地电阻的数值与接地装置的形状和尺寸有关 ， 与土壤电阻率无关 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c4-judge-55","subject":"high-voltage","chapter":4,"chapterTitle":"电力系统防雷保护","type":"judge","typeLabel":"判断题","number":55,"page":50,"text":"被保护物体在避雷针的保护范围内 ， 绝对不会遭受雷击的 （\n扫描全能王\n3 亿人都在用的归韉 App","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-1","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":1,"page":51,"text":"工频电压升高属于 （\nA ． 操作过电压\nB ， 谐振过电压\nC ， 暂时过电压\nD ． 大气过电压","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-2","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":2,"page":51,"text":"空载线路合闸的时候 ， 可能产生的最大过电压为 （\nA.1.5Em\nB .2Em\nC.3Em\nD.4Em","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-3","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":3,"page":51,"text":"以下属于操作过电压的是 （\nA ． 工频电压升高\nB ． 电弧接地过电压\nC ． 变电所侵人波过电压\nD ， 铁磁谐振过电压","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-4","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":4,"page":51,"text":"发电机突然甩负荷引起的过电压属于 （\nA ． 操作过电压\nB 諧振过龟压\nC ． 外部过电压\nD ． 工频过电压 （ 暂时过电压 ）","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-5","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":5,"page":51,"text":"超高压输电线路在空载时 ， 线路各点电压 （\nA ． 均相等\nB 盾端最高\nC 床端最高\nD ， 中间最高","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-6","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":6,"page":51,"text":"若电源漏抗增大 ， 将使空载长线路的末端工频电压 （\nA ． 畸变\nB ， 减弱\nC ． 升高\nD ． 不变","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-7","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":7,"page":51,"text":"在双端电源的线路中 ， 线路两端的断路器必须遵循一定的操作顺序应为 〔\nA · 线路合闸时 ： 先合电源容量较小的一侧 ， 后合电源容量较大的一侧\nB ， 线路合闸时 ： 先合电源容量较大的一侧 ， 后合电源容量较小的一侧\nC ， 线路切除时 ： 先切电源容量较大的一侧 ， 后切电源容量较小的一侧\nD ． 线路切除时 ： 先切哪一侧都可以\n） 为依据 。","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-8","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":8,"page":51,"text":"在单端电源的线路中 ， 为了估计最严重的工频电压升高 ， 应以系统 （\nA ． 最小运行方式\nB ． 最大运行方式\nC ． 故障运行方式\nD ， 各种方式都可以","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-9","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":9,"page":51,"text":"中性点经消弧线圈接地通常采用的运行方式是 （\nA ， 全补偿\nB ． 过补偿\nC 次补偿\nD ． 不确定","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-10","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":10,"page":51,"text":"切除空载变压器出现过电压的主要原因是 （\nA ， 电弧重燃\nB ． 截流现象 （ 开断的感性电流提前截断 ）\n扫描全能王\n3 亿人都在用的归韉 App\nC ． 电容效应\nD ． 中性点不接地","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-11","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":11,"page":52,"text":"1 、 中性点不接地系统发生间歇性电弧接地过电压 ， 非故障相最大过电压倍数 （\nA.1.5\nB.2\nC25\nD ， 3 ， 5","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-12","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":12,"page":52,"text":"对于空载线路而言 ， 线路越长 ， 线路末端工频电压升高越严重 ， 当线路长度为 （\n线路处于谐振状态 。\nA ． L = 600 1\nB ． L = 900 lan\nC ． L = 1200 lan\nD ． L = 1500","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-13","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":13,"page":52,"text":"在电力系统中发生铁磁谐振时 ， 谐振回路中电感参数是 （\nA ． 常数\nB ． 线性\nC ． 受控\nD ． 非线性\n） 的情况最为严重 。","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-14","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":14,"page":52,"text":"在合闸过电压中 ， 以 （\nA ． 单相自动重合闸\nB 俩相自动重合闸\nC 三相自动重合闸\nD ， 断路器合闸","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-15","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":15,"page":52,"text":"切除空载线路时产生过电压的根本原因是 （\nA ． 断路器的电弧重燃\nB ． 系统阻尼大\nC ， 接地电阻比较大\nD 具有残留电压","answer":"A","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c5-single-16","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":16,"page":52,"text":"断路器的灭弧能力越差 ， 重燃几率越大 ， 则切空载变压器过电压幅值 （\nA ． 越大\nB ． 越小\nC ， 不变\nD ． 无法确定","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-17","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":17,"page":52,"text":"下列不是限制切除空载线路时的过电压大小的措施的是 （\nA ． 提高断路器的灭弧能力\nB ． 在断路器中并联分闸电阻\nC ． 线路首末端装设避雷器\nD ． 改变线路长度\n系统 ， 母线上的暂态工频过电压升高不超过最","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-18","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":18,"page":52,"text":"目前我国规定 ：\n330kV 、 500kv 、 750kv\n高工作相电压的 （\n口 0\nA.1.3\nB.1.4\nC.l.5\nD.l.6\n系统 ， 线路上的暂态工频过电压升高不超过最","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-19","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":19,"page":52,"text":"目前我国规定 ，\n· 330kv 、 500kv 、 750kV\n高工作相电压的 （\nA.1.3\nB.1.4\nC.l.5\nD.1.6","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-20","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":20,"page":52,"text":"抑制参数谐振过电压的措施是 （\nA ． 采用电容式电压互感器\nB ． 发电机在正式投人运行前 ， 设计部门要进行自激的校验 ， 避开谐振点\nC ， 改善电磁式电压互感器的激磁特性\nD ． 在电压互感器开口三角绕组中接人阻尼电阻 ， 或在电压互感器一次绕组的中性点对地接\n人电阻\n扫描全能王\n3 亿人都在用的归韉 App","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-21","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":21,"page":53,"text":"线性谐振的条件是 （\nA ． 等值回路中的自振频率等于或接近电源频率\nB ． 等值回路中的自振频率大于电源频率\nC ， 等值回路中的自振频率小于电源频率\nD ． 以上都不对","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-22","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":22,"page":53,"text":"空载线路合闸时 ， 产生过电压的根本原因是 （\nA ． 电容 、 电感的振荡 ， 其振荡电压叠加在稳态电压上所致\nB ． 电弧重燃\nC ． 截流现象\nD ． 容升效应","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-23","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":23,"page":53,"text":"空载线路自动重合闸时 ， 在合闸过电压中 ， 以三相重合闸的情况最为严重 ， 其过电压\n） 倍的电源电动势的幅值 。\n理论幅值可达 （\nC.3\nD ． 4\n） 时 ， 合闸空载线路的过电压最大 。","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-24","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":24,"page":53,"text":"一般情况下 ， 合闸时电源电压为 （\nA ． 过零点\nB ． 最小值\nC ． 幅值\nD ． 相位士 120 。","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-25","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":25,"page":53,"text":"特高压输电线路空载时会产生工频过电压 ， 一般用以下哪种方式限制 （\nA ． 并联电抗器\nB ， 并联电容器\nC ． 串联电抗器\nD ， 串联电容器","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-26","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":26,"page":53,"text":"切除空载变压器过电壓帥限制措施中可以采用在断路器的主触头上并联电阻 ， 该电阻\n数量级应为 （\nA ， 4000\nB ． 10000\nC.30000\nD ． 与励磁阻抗同一数量级","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-27","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":27,"page":53,"text":"以下几种方法中在抑制切空载线路过电压时相对最为有效的是 （\nA ． 采用多油断路器\nB ． 采用中性点绝缘系统\nC ． 采用六氟化硫断路器\nD ， 中性点经消弧线圈接地","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-28","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":28,"page":53,"text":"发生铁磁谐振时 ， 会出现 “ 相位反倾 ” ， 这个是指 （\nA. 回路特性由感性变为容性\nB 洄路特性由容性变为感性\nC. 回路特性由阻性变为容性\nD. 回路特性由容性变为阻性","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-29","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":29,"page":53,"text":"当变压器带有一段电缆时 ， 使用截流水平相同的断路器切除空载变压器产生的过电压\nA ． 变大\nB ． 变小\nC ， 持续时间长\nD ． 持续时间短","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-30","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":30,"page":53,"text":"空载长线路末端电压升高引起的原因是 （\nA ． 断路器灭弧性能不好\nB ． 中性点不接地\n扫描全能王\n3 亿人都在用的归韉 App\nC ． 电容效应\nD ． 线路电感电流突变","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-31","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":31,"page":54,"text":"采用带并联电阻的断路器合空载线路时 ， 触头动作顺序是 （\nA ． 主触头先合\nB ． 辅助触头先合\nC ， 主触头和辅助触头同时合上\nD ． 辅助触头不合","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-32","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":32,"page":54,"text":"确定电气设备绝缘水平时不考虑 （\nA ． 直击雷过电压\nB ． 操作过电压\nC 諧振过电压\nD ． 感应雷过电压","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-33","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":33,"page":54,"text":"谐振过电压不包括 （\nA ． 线性谐振过电压\nB ． 铁磁谐振过电压\nC 渗数谐振过电压\nD ． 断续电弧接地过电压","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-34","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":34,"page":54,"text":"下列不是空载线路合闸过电压的影响因素有 （\nA ． 合闸相位\nB ． 线路损耗\nC ． 线路残压电压变化\nD ． 断路器的灭弧性能","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-35","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":35,"page":54,"text":"下列过电压为暂时过电压的有 （\nA ． 操作过电压\nB 直接雷击过电压\nC ． 感应雷击过电压\nD ． 谐振过电压","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-36","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":36,"page":54,"text":"对于工频电压升高 ， 以下说法正确的是 （\nA ． 一般而言 ， 工频电压升高对 220kV 等级以上 、 线路不太短的系统的正常绝缘的电气设备\n是没有危险的\nB ， 幅值比操作过电压小 ， 不用专门限制\nC ． 工频电压升高的数值是决定保护电器工作条件的主要依据\nD ． 工频电压升高持续时间比操作过电压短\n） 的电网中 。","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-37","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":37,"page":54,"text":"单相弧光接地过电压主要发生在 （\nA ． 中性点直接接地\nB ． 中性点经消弧线圈接地\nC ． 中性点经小电阻接地\nD ， 中性点不接地","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-38","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":38,"page":54,"text":"如下电压等级线路中 ， 要求操作过电压倍数最低的是 （\nA.60kV 及以下\nB.11-0kV\nC.220kV\nD.500kV","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-39","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":39,"page":54,"text":"断路器并联电阻可以有效抑制合闸空载线路或切除空载线路的过电压 ， 关于二者的电\n阻大小 ， 说法正确的是 （\nA ． 合闸电阻一般是低值电阻\nB ． 合闸电阻一般是中值电阻\nC ． 分闸电阻一般是低值电阻\nD. 合闸电阻一般是高值电阻","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-40","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":40,"page":54,"text":"并联电抗器中性点的小电抗可以限制 （\nA ． 恢复电压\nB ． 操作过电压\nC 潜供电流\nD ， 间歇性电弧","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-41","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":41,"page":54,"text":"操作过电压不包括 （\n衡真电网\n扫描全能王\n3 亿人都在用的归韉 App\nA 沏断空载线路过电压\nB 空载线路合闸过电压\nC ． 切断空载变压器过电压\nD ． 铁磁谐振过电压","answer":"D","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-42","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":42,"page":55,"text":"以下是操作过电压特点的是 （\nA ． 弱阻尼 ， 衰减慢\nB ． 幅值低 ， 持续时间长\nC ． 强阻尼 ， 幅值较高\nD ， 比雷电过电压持续时间短","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-single-43","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"single","typeLabel":"单选题","number":43,"page":55,"text":"切除空载变压器产生过电压的原因是 （\nA ， 空载变压器的电容效应\nB ， 断路器灭弧性能好出现的截流现象\nC ． 断路器的重燃\nD ． 间歇性电弧","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-1","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":1,"page":55,"text":"空载线路合闸过电压的影响因素有 （\nA ， 合闸时电源电压的相位角\nB ． 线路损耗\nC ， 线路上残压的变化\nD ． 母线上出线数","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-2","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":2,"page":55,"text":"以下不属于操作过电压的是 （\nA ， 工频电压升高\nB ． 电弧接地过电压\nC ． 解列过电压\nD ． 铁磁谐振过电压","answer":"AD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-3","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":3,"page":55,"text":"关于操作过电压 ， 说法正确的是 （\nA. 幅值高\nB ． 存在高频振荡 、 强阻尼\nC ． 持续时间很长\nD ． 比雷电过电压持续时间长","answer":"ABD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-4","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":4,"page":55,"text":"常见的操作过电压主要包括 （\nA ． 切断空载线路过电压\nB ． 空载线路合闸过电压\nC ． 切除空载变压器过电压\nD 冲性点不接地系统中的电弧接地过电压","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-5","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":5,"page":55,"text":"针对合空线过电压的形成及其影响因素 ， 限制合闸过电压的措施主要有 （\nA ． 采用带有合闸电阻的断路器\nB ． 同步合闸\nC ． 采用避雷器\nD ． 采用灭弧性能好的断路器","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-6","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":6,"page":55,"text":"发电机的自激过电压不属于 （\nA ． 线性谐振过电压\nB ， 铁磁谐振过电压\nC ． 参数谐振过电压\nD ． 电压谐振","answer":"ABD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-7","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":7,"page":55,"text":"电力系统内部过电压可以分为 （\nA ． 直击雷过电压\nB ， 感应雷过电压\nC ． 暂时过电压\nD 操作过电压","answer":"CD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-8","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":8,"page":55,"text":"电力系统暂时过电压可以分为 （\nA 江频电压升高\nB 諧振过电压\nC ． 外部过电压\nD ． 操作过电压","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-9","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":9,"page":55,"text":"以下不属于操作过电压的是 （\nA ， 电弧接地过电压\nB ， 合空变过电压\n扫描全能王\n3 亿人都在用的归韉 App\nC ． 切空线过电压\nD ． 甩负荷引起的过电压","answer":"BD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-10","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":10,"page":56,"text":"对于工频电压升高 ， 以下说法正确的是 （\nA. 对 220kV 等级以下 、 线路不太长的系统一般不用专门限制工频过电压\nB ． 对超高 、 远距离传输系统绝缘水平的确定有重要影响\nC ． 工频电压升高的数值是决定保护电器工作条件的主要依据\nD 工频电压升高持续时间比操作过电压短","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-11","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":11,"page":56,"text":"1 、 关于电力系统工频过电压以下说法正确的是 （\nA ． 操作过电压与工频电压升高不会同时发生\nB 江频电压的升高会影响操作过电压的幅值\nC 江频电压升高持续时间较长 ， 对设备绝缘及其运行性能有重大影响\nD ． 工频电压升高幅值越大 ， 刈断路器并联电阻热容量的要求也越高 ， 从而给制造低值并联\n电阻带来困难","answer":"BCD","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c5-multi-12","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":12,"page":56,"text":"工频电压升高的限制措施有 （\nA ． 利用并联电抗器补偿空载线路的电容效应\nB ． 利用静止补偿器补偿限制工频过电压\nC ． 采用良导体地线降低输电线路的零序阻抗\nD ． 工频电压升高对电力系统安全运行没有影响 ， 不需要限制","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-13","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":13,"page":56,"text":"谐振过电压的类型有 （\nA ． 线性谐振过电压\nB 参数谐振过电压\nC ． 铁磁谐振过电压\nD ． 非参数谐振过电压","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-14","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":14,"page":56,"text":"在电源电势 E 的作用下电路中将出现三个平衡点 ， 以下锐法正确的是 （\nU åU\nUc(0\nA.a1 是谐振点\nB.a2 是不稳定的\nC.a3 是谐振点\nD.a3 处回路是感性的","answer":"BC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-15","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":15,"page":56,"text":"抑制铁磁谐振过电压的措施是 （\nA ． 使回路脱离线性谐振状态或者增加回路的损耗\nB ． 发电机在正式投人运行前 ， 设计部门要进行自激的校验 ， 避开谐振点\nC ． 改善电磁式电压互感器的激磁特性\nD ． 在电压互感器开口三角绕组中接人阻尼电阻 ， 或在电压互感器一次绕组的中性点对地接\n扫描全能王\n3 亿人都在用的归韉 App\n人电阻","answer":"CD","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c5-multi-16","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":16,"page":57,"text":"消除或降低切断空载线路过电压采取的措施有 （\nA ． 改善断路器的结构 ， 避免发生重燃现象 B ． 断路器加装并联电阻\nC ． 利用避雷器保护\nD ． 泄流设备的装设","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-17","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":17,"page":57,"text":"三相断路器不同期合闸 ， 对于线路的影响有 （\nA ． 形成三相电路瞬时的不对称 ， 在中性点非直接接地或中性点绝缘系统更为严重\nB 三相之间存在互感及电容的耦合作用 ， 在未合闸相上感应出与已合闸相极性相同的电压 ，\n待该相合闸时可能出现反极性合闸的情况 ， 产生高幅值的过电压\nC ， 断路器的不同期合闸会使过电压幅值增高\nD ． 没有影响","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-18","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":18,"page":57,"text":"8 、 切空载变压器过电压影响因素有 （\nA ， 断路器的性能\nB ． 变压器的对地电容\nC ． 空载励磁电流\nD ． 变压器的电感","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c5-multi-19","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":19,"page":57,"text":"对于切空载变压器过电压的限制措施有 （\nA ． 采用性能更好的断路器\nB ． 采用激磁电流较小的变压器\nC ． 变压器绕组改用纠结式绕法以及增加静电屏蔽等措施 ， 使过电压有所降低\nD ． 装设并联电阻和采用避雷器保护","answer":"BCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-20","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":20,"page":57,"text":"断续电弧接地过电压的发展过程和幅值大小都与熄弧时间有关 ， 存在的熄弧时间类型\nA ． 发生在大气中的开放性电弧往往要到工频电流过零时才能熄灭\nB ， 在强烈去电离的条件下 ， 电弧往往在过渡过程中的高频电流过零时就能熄灭\nC ， 电弧的熄灭发生在工频电流最大值的时刻\nD ． 电弧在过渡过程中的高频振荡电流最大时即可熄灭","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-21","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":21,"page":57,"text":"按工频电流过零时熄弧的理论分析得出的结论是 （\nA ， 非故障相上的最大过电压为 3 巧倍\nB ． 故障相上的最大过电压为 2 ， 0 倍\nC ． 故障点电弧在工频电流过零时和高频电流过零时熄灭都是可能的\nD ． 电弧的燃烧和熄灭会受到发弧部位的周围媒质和大气条件等的影响 ， 具有很强的随机性\n质 ， 因而它所引起的过电压值具有统计性质","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-22","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":22,"page":57,"text":"为了消除电弧接地过电压 ， 最根本的途径就是消除间歇性电弧 ， 可以通过 （\n实现 。\nA ． 改变中性点接地方式\nB ． 采用中性点直接接地方式\nC ． 采用中性点经消弧线圈接地方式\nD ． 采用中性点经高阻接地方式","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-23","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":23,"page":57,"text":"以下不是切除空载变压器出现过电压的主要原因的是 （\nA ． 电弧重燃\nB ． 截流现象\n扫描全能王\n3 亿人都在用的归韉 App\nC ． 电容效应\nD 冲性点不接地","answer":"ACD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-24","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":24,"page":58,"text":"下列是空载线路合闸过电压的主要影响因素是 （\nA 哈闸相位\nB ． 线路损耗\nC ． 线路上残压的变化\nD ． 断路器的灭弧性能","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-25","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":25,"page":58,"text":"提高断路器的灭弧能力 ， 不能抑制下列过电压中的 （\nA ， 电弧接地过电压\nB ． 切除空载变压器过电压\nC ． 空载线路合闸过电压\nD ． 空载线路分闸过电压","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-26","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":26,"page":58,"text":"以下属于暂时过电压是 （\nA ， 发电机突然甩负荷引起的过电压\nB ． 切除空载变压器过电压\nC ． 弧光接地过电压\nD ． 铁磁谐振过电压","answer":"AD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-27","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":27,"page":58,"text":"切断空载线路过电压的影响因素有 （\nA. 中性点接地方式\nB ． 断路器性能\nC ． 母线上的出线数\nD ． 断路器外亻则是否有电磁式电压互感器等设备","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c5-multi-28","subject":"high-voltage","chapter":5,"chapterTitle":"电力系统内部过电压及其防护措施","type":"multi","typeLabel":"多选题","number":28,"page":58,"text":"以下属于暂时过电压的有 （\nA ， 参数谐振过电压\nB ， 工频电压升高\nC ． 空载长线电容效应引起的电压升高\nD ． 断续电弧接地过电压\n） 等 。","a
