","typeLabel":"判断题","number":16,"page":13,"text":"电力系统继电保护主要是线路的保护和设备的保护两部分 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-17","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":17,"page":13,"text":"电力系统出现了零序电一定是发生了接地故障 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-18","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":18,"page":13,"text":"继电保护主要是由测量部分 、 逻辑部分和执行部分组成 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-19","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":19,"page":13,"text":"灵敏性是指电气设备或线路在被保护范围内发生短路或不正常运行情况时 ， 一保护装置\n的反应能力 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-20","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":20,"page":13,"text":"配备了近后备 + 断路器失灵保护的元件 ， 当主保护拒动时 ， 可以由近后备或者断路器失\n灵保护启动 ， 从而切除故障 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-21","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":21,"page":13,"text":"电力系统一次设备包括发电机 、 变压器 、 母线 、 输电线路 、 电动机 、 ， 电抗器 、 电容器 、\n仪表等组成的电能传输设备 （ 属于高压设备 ） 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-22","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":22,"page":13,"text":"电磁型继电器 ， 如果电磁力矩大于弹簧力矩与摩擦力矩的和则继电器就动作 ， 如果电\n磁力矩小于弹簧力矩与摩擦力矩的和则继电器就返回 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-23","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":23,"page":13,"text":"发电机突然甩负荷引起频率升高属于不正常的状态 。 （","answer":"A","boundaryInferred":false,"subject":"relay","opt 度地确保安全发电 、 供电 。 （","answer":"A","boundaryInferred":true,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-32","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":32,"page":14,"text":"当电力系统发生短路故障时 ， 切除故障的时间越快越好 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-33","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":33,"page":14,"text":"快速切除线路和母线的故障 ， 是提高电力系统静态稳定的最重要手段 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-34","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":34,"page":14,"text":"对保护装置动作的选择性要求是通过选择高质量的继电器来保证的 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-35","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":35,"page":14,"text":"保护装置动作的选择性要求是通过合理地选择保护方案 、 正确地进行整定计算以及精\n确地调整试验而获得的 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-36","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":36,"page":14,"text":"对保护装置动作的可靠性要求是通过选择高质量的继电器来保证的 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-37","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":37,"page":14,"text":"电力系统的故障中 ， 除了三相短路 ， 其他的都是非对称的 ， 所以除了三相短路 ， 其他\n的故障都会产生零序和负序分量 。 〈","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-38","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":38,"page":14,"text":"电力系统故障时 ， 继电保护装置只发出信号 ， 不切除故障设备 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-39","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":39,"page":14,"text":"继电保护装置的测量部分是测量被保护元件的某些运行参数与保护的整定值进行比较 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-40","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":40,"page":14,"text":"电力系统发生故障时 ， 继电保护装置如不能及时动作 ， 就会破坏电力系统运行的静态\n稳定性 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-41","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":41,"page":14,"text":"电气设备过负荷时 ， 继电护应将过负荷设备切除产 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-42","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":42,"page":14,"text":"我国 35 千伏及以下电压等级的电网中 ， 中性点采用中性点不接地方式或经消弧线圈接\n地方式 。 这种系统被称为小接地电流统 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-43","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":43,"page":14,"text":"在配电网的线路呆护一般都配备完整的三段式电流保护功 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-44","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":44,"page":14,"text":"电流互感器一次和二次绕组电压和电流的参考方向 ， 应按减极性原则标注 （ ）","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-45","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":45,"page":14,"text":"电磁型电流继电器的整定值 ， 在弹簧力矩不变的情况下 ， ， 俩线圈并联时 ， 比串联时大一\n倍 ， 这是因为并联时梳人线圈中的电流比串联时大一倍 。 “ 〖","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1-judge-46","chapter":1,"chapterTitle":"电力系统继电保护的基本概念和要求","type":"judge","typeLabel":"判断题","number":46,"page":14,"text":"采用阶段式配合的保护 ， 其 I 段是以牺牲灵敏性保证其选择性的 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c1 dge-23","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":23,"page":56,"text":"高频保护不应该反映被保护输电线路范围以外的故障 ， 故可以不带动作延时 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-24","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":24,"page":56,"text":"凡是影响距离保护正确动作的因素同样影响纵联距离保护 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-25","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":25,"page":56,"text":"高频通道由阻波器 ， 连接滤波器 ， 结合电容器 ， 高頻收发信机等构成 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-26","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":26,"page":56,"text":"高频收发信机 ， 可以收到对端发出的信号和自己发出的信号 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-27","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":27,"page":56,"text":"高频亻自号和高频电流是一个概念 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-28","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":28,"page":56,"text":"高频闭锁方向保护中有两套灵敏度不同的启动元件 ， 灵敏度高的用于发出信号 ， 灵敏\n度低的用于跳闸 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-29","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":29,"page":56,"text":"允许式纵联方向保护在功率倒向对不会误动 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-30","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":30,"page":56,"text":"高频保护停用 ， 只须将保护装置高频保护连接片断开即可 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-31","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":31,"page":56,"text":"1 、 工频变化量保护需要振荡闭锁 。 （","answer":"B","boundaryInferred":true,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-32","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":32,"page":56,"text":"因为高频保护不反应被保护线路以外的故障 ， 所以不能作为下一段线路的后备保护 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-33","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":33,"page":56,"text":"接滤波器和耦合电容器组成的带通滤波器对 50Hz 工应呈现极大的衰耗 ， 以阻止工\n频串人高频裝置 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-34","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":34,"page":56,"text":"高频保护与通信合用通道时 ， 通信人员可以随便在通道上工作 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-35","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":35,"page":56,"text":"因为高频发信机经常向通道发检查信号 ， 所以线路的高頻保护不用对试 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-36","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":36,"page":56,"text":"高频保护使用的频率越高其通道衰耗越小 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-37","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":37,"page":56,"text":"线路两侧高频保护一侧为允许式 ， 另一侧误设置为闭镇式 ， 线路发生区内故障时 ， 两\n侧高频保护均可能拒动 ， 区外故障时正方向侧保护可能误动 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-38","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":38,"page":56,"text":"8 、 相差高频保护的工作方式采用闭锁式 ， 装置启动后 ， 收到连续高频信号就启动出口继\n电罨 。 （","answer":"B","boundaryInferred":true,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-39","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":39,"page":56,"text":"高频保护通道的动作方式 ， 可以分为长期发信 、 故障时发信和移频发信方式 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-40","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":40,"page":56,"text":"相差高频保护的基本工作原理是比较被保护线路两侧电流的相位 。 〈\n衡真电网\n全国统一服线 ： 4006781236","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-41","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":41,"page":57,"text":"高频保护启动发信方式有 ： 保护启动 ； 远方启动 ； 手劫启动 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-42","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":42,"page":57,"text":"纵差动保护是通过比较被保护元件各侧的电流大小及相位而构成 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-43","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":43,"page":57,"text":"与正常运行情况相比 ， 外部故障时流过差动继电器的不平衡电流较大 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-44","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":44,"page":57,"text":"纵差动保护不受过负荷的影响 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-45","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":45,"page":57,"text":"纵差动保护不受系统振荡的影响 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-46","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":46,"page":57,"text":"横差方向保护 ， 是基于比较同一侧两回线路中电流的大小和方向而构成的一种保护 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-47","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":47,"page":57,"text":"当单回线路运行时应退出横差方向保护 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-48","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":48,"page":57,"text":"横差方向保护不能作为相邻线路的后备保护 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-49","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":49,"page":57,"text":"延长纵联保护的一点动作时间 ， 且用之得当 ， 可以显著提高纵联保护动作的可靠性 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-50","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":50,"page":57,"text":"高频保护通道传送的信号按其作用的不同 ， 可分为跳闸信号 、 允许信号和闭锁信号三","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-51","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":51,"page":57,"text":"现代微机式高频方向保护中普遍采用正 、 反两个方向元件 ， 其中反方向元件动作要比\n正方向元件动作灵敏 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-52","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":52,"page":57,"text":"在高频闭锁保护中 ， 当发生区夕卜故障时 ， 总有一侧保护视之为正方向 ， 故这一侧停信 ，\n而另一侧连续向线路两侧发出闭锁信号 ， 因而两侧高频闭锁保护不会动作跳闸 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-53","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":53,"page":57,"text":"电流差动保护中的不平衡电流的大小与穿越电流的大小有关 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-54","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":54,"page":57,"text":"主保护双重化主要是指两套主保护的交流电流 、 电压和直流电源彼此独立 ， 有独立的\n选相功能 ， 有两套独立的保护专 （ 复 ） 用通道 ， 断路器有两个跳闸线圈 、 每套保护分别启动一","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-55","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":55,"page":57,"text":"从测量元件来看 ， 一般相间距离保护和接地距离保护所接人的电压与电流没有什么不","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-56","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":56,"page":57,"text":"某 220kv 输电线路装设高频保护 ， 其保护范围为两侧独立电流互感器之间虱 ）","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-57","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":57,"page":57,"text":"电力载波通信就是将保护信号寄载于频率为 40 ～ 500mz 的高频波之上的产种通信方式 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-58","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":58,"page":57,"text":"高频保护采用相一地制高频通道是因为相一地制通道衰耗小 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-59","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":59,"page":57,"text":"连接滤波器和耦合电容器组成一个带通滤波器 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-60","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":60,"page":57,"text":"无论保护是否想跳闸 ， 只要收到跳闸信号 ， 保护就去跳闸 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c4-judge-61","chapter":4,"chapterTitle":"输电线路纵联保护原理","type":"judge","typeLabel":"判断题","number":61,"page":57,"text":"高频闭锁方向保护在区外故障时 ， 两侧都发闭锁信号 ， 所以保护不跳闸 。\n全国统一服务热纬 ： 4006781236","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-1","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":1,"page":58,"text":"在电力系统线路的故障中 ， 大多数是 （\nA ． 架空线路\nB ． 电缆线路\nC ． 与线路的长度有关\nD ． 双回线路","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-2","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":2,"page":58,"text":"电力系统的运行经验表明 ， 架空线路的故障大部分是 （\nA ． 瞬时性故障\nB 泳久性故障\nC ， 与线路的长度有关\nD. 以上都不对","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-3","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":3,"page":58,"text":"下列不属于瞬时性障的是\nA ， 雷电引起的绝缘子表面闪络\nB ． 大风引起的碰线\nC · 鸟类在线路上引起的短路\nD ， 由于线路倒杆引起的故障","answer":"D","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-4","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":4,"page":58,"text":"由值班人员手动操作或通过遥控装置将断路器断开时 ， 自动重合闸装置应该 （\nA ． 不动作\nB ． 延时动作\nC ． 视情况而定\nD. 以上都不对","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-5","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":5,"page":58,"text":"自动重合闸的动作次数为 （\nC ． 符合预先规定的次数\nD ， 五次","answer":"C","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-6","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":6,"page":58,"text":"当断路器处于不正常运行状态一 （ 例如操作机构中的液压 《 气压降低等 ） 时 ， 自动重合闸\n装置应 （\nA ． 开放\nB ． 闭锁\nC ． 视情况而定\nD ． 延时动作","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-7","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":7,"page":58,"text":"下列不屑于自动重合闸的种类有 （\nA ． 单相重合闸\nB 三相重合闸\nC ． 综合重合闸\nD ． 两相重合闸","answer":"D","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-8","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":8,"page":58,"text":"在没有其他联系的双回线路上 ， 当不能采用非同步重合闸时 ， 可以采用检定另一回线路\n上有电流的重合闸 ， 原因是 （\nA ． 电流检定比同步检定简单\nB ． 运行比较经济\nC ， 灵敏性好\nD ． 以上都不对","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-9","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":9,"page":58,"text":"在双侧电源的单回线路上 ， 当不能采用非同步重合闸时 ， 可以采用解列重合闸 ， 解列点\n的选择原则是 （\nA ， 使发电厂的容量与其所带的负荷相平衡 B ． 发电厂的容量越大越好\nC 泼电厂的容量越小越好\nD ． 以上都不对\n全国统一服务热纬 ， 4006781236","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-10","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":10,"page":59,"text":"重合闸前加速保护的特点是 （\nA ． 第一次动作有选择性\nB ． 第一次动作没有选择性\nC ， 使用设备复杂不经济\nD ． 以上都不对","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-11","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":11,"page":59,"text":"1 、 重合闸后加速保护的特点是 （\nA ． 第一次动作有选择性\nB ， 第一次动作没有选择性\nC ． 使用设备简单经济\nD ． 以上都不对","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-12","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":12,"page":59,"text":"重合闸前加速保护的适用范围是 （\nA.35kV 及以下的发电厂或变电所的直配线路 B.110kV 及以上的超高压线路\nC 衽何电压等级的输电线路\nD ． 以上都不对","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-13","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":13,"page":59,"text":"重合闸后加速保护的适用范围是 （\nA.35kV 以上的网络及对重要负荷供电的送电线路上\nB.35kV 及以下的发电厂或变电所的直配线路\nC ， 任何电压等级的输电线路\nD ． 以上都不对","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-14","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":14,"page":59,"text":"单相自动重合闸主要是针对于 （\nA ． 单相接地短路\nB ， 三相接地短路\nC ． 相间短路故障\nD ． 两相接地短路\n） 正确率 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-15","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":15,"page":59,"text":"输 \nA ． 单相重合闸和三相重合闸结合在一起\nB ． 多个单相重合闸结合在一起\nC ， 多个三相重合闸结合在一起\nD. 以上都不对","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-23","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":23,"page":60,"text":"当发生单相接地短路时 ， 对综合重合闸的动作描述正确的是 （\nA ． 跳开单相 ， 然后进行单相重合 ， 重合不成功则跳开三相而不再重合\nB ， 跳开三相不再重合\nC ． 跳开三相 ， 重合三相\nD ． 以上都不对","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-24","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":24,"page":60,"text":"当选相元件拒绝动作时 ， 应 （\nA ． 跳开三相不再重合\nB ． 跳开三相 ， 重合三相\nC ． 跳开三相 ， 重合单相\nD ． 以上都不对","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-25","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":25,"page":60,"text":"对空气断路器或者液压传动的油断路器 ， 当气压或液压低至不允许实行重合闸时 ， 应\n将重合闸 （\nA ． 开放保护\nB ． 闭锁重合闸\nC ． 延时动作\nD ． 以上都不对","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-26","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":26,"page":60,"text":"无论单相或三相重合闸 ， 在重合不成功后 ， 应实现 （\nA ． 重合闸前加速\nB ， 重合闸后加速\nC ， 重合闸延时动作\nD ， 以上都不对","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-27","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":27,"page":60,"text":"自动重合闸能够提高系 ． 统并列运行的 （\nA ． 静态稳定性\nB ， 暂态稳定性\nC ． 灵敏性\nD ． 以上都不","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-28","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"single","typeLabel":"单选题","number":28,"page":60,"text":"一般情况下的 ， 电力系统中没有以下哪种重合闸方式 （ 。 ，\nA ． 发电机重合闸\nB ． 线路重合闸\n。 0 D ． 变压器重合闸\nC ． 母线重合闸","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-single-29","chapter":5,"chapterTitle" i-6","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":6,"page":63,"text":"重合闸后加速保护的缺点有 （\nA ， 第一次切除故障带有延时\nB ． 每个断路器上都需要装设一套重合闸 ， 与前加速相比较为复杂\nC ． 设备装置复杂 ， 与前加速相比不经济\nD ， 以上都不对","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-7","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":7,"page":63,"text":"关于自动重合闸基本要求的描述 ， 以下说法正确的是 （\nA. 自动重合闸装置一般采用控制开关位置与断路器位置对应原理起动\nB 洎动重合闸装置必须能够自动复归 ， 不允许手动复归\nC 洎动重合闸装置应动作迅速\nD ， 手动跳闸时自动重合闸装置不应该重合","answer":"CD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-8","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":8,"page":63,"text":"故障相选择元件包括 （ 一一一\nA ， 电流选相元件\nB ， 低电压选相元件\nC ． 阻抗选相元件\nD 以上都不对","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-9","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":9,"page":63,"text":"按照作用于断路器的方式 ， 重合闸的类型有 （\nA ， 两相重合闸\nB ， 单相重合闸\nC 三相重合闸\nD ， 综合重合闸","answer":"BCD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-10","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":10,"page":63,"text":"在单相自动重合闸中 ， 动作时限的整定应包括 （\nA ． 大于故障点灭弧时间\nB ． 大于断路器及其操作机构恢复原状准备好再次动作的时间\nC 不论是单侧电源还是双侧电源 ， 应考虑两侧选相元件与继电保护以不同时限切除故障的\n可能性\nD ， 潜供电流对灭弧产生的影响","answer":"ABCD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-11","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":11,"page":63,"text":"1 、 下列对潜供电流的影响正确的是 （\nA 一般线路的电压越高 ， 线路越长 ， 潜供电流越大\nB ． 潜供电流的持续时间不仅与其大小有关还与好多因素有关\nC ， 潜供电流的持续时间与故障切除的时间 ， 弧光的长度有关\nD ， 以上都不对","answer":"ABC","boundaryInferred":true,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-12","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":12,"page":64,"text":"单相重合闸的主要优点有 （\nA ． 能在大多数的故障情况下保证对用户的连续供电 ， 从而提高供电的可靠性\nB ． 当由单侧电源单回线路向重要负荷供电时 ， 对保证不间断供电具有更显著的优越性\nC ． 在双侧电源的联络线上采用单相重合闸时 ， 可以提高系统并列运行的动态稳定性\nD ． 以上都不对","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-13","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":13,"page":64,"text":"单相重合闸的缺点有 （\nA ． 需要有按相操作的断路器\nB ． 需要专门的选相元件与继电保护相配合 ， 重合闸回路的接线比较复杂\nC ， 在单相重合闸过程中 ， 可能引起其它线路误动作 ， 因此要采取措施给与制止 ， 这就使保\n护的接线 ， 整定计算和调试工作复杂化\nD ， 以上都不对","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-14","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":14,"page":64,"text":"综合重合闸包括 （\nA ， 单相重合闸\nB 三相重合闸\nC 眵次重合闸\nD ． 以上都不对","answer":"AB","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-15","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":15,"page":64,"text":"对综合重合闸的描述 ， 叙述正确的是 （\nA ． 单相接地短路时跳开单相 ， 然后进行单相重合 ， 如重合不成功则跳开三相不再重合\nB ， 当选相元件拒绝动作时 ， 应能跳开三相并进行重合\nC ． 任两相的分相跳闸继电器动作后 ， 应连跳第三相 ， 使三相断路器均跳闸\nD ． 以上都不对","answer":"ABC","boundaryInferred":true,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-16","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":16,"page":64,"text":"在电力系统中采用 ze 十的技术经济效果 ， 包括哪些方面 ： (— ． ） 。\nA ． 大大提高供电可靠性 ， 减少线路停电的次数 ， 特别是对单侧电源的线路尤为显著\nB ， 在高压输电线路上采用重合闸 ， 还可以提高电力系统并列运行的稳定性\nC ， 在电网的设计与建设过程中 ， 考虑重合闸的作用 ， 即可暂缓架设双回线路 ， 以节约投资\nD · 对断路器本身由于机构不良或继电保护误动而引起的误跳闸 ， 也能起到纠正的作用","answer":"ABCD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-17","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":17,"page":64,"text":"关于实现综合重合闸功能时应该考虑的基本原则 ， 叙述正确的是 （\nA ． 在非全相运行中可能误动作的保护 ， 应将其可靠闭锁\nB ． 当一相跳开后重合闸拒绝动作时 ， 将重合闸装置闭锁\nC ． 应配合重合闸前加速保护使用\nD ， 在非全相运行过程中 ， 如又发生另一相或两相的故障 ， 保护应能有选择性地予以切除","answer":"AD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-18","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":18,"page":64,"text":"当作用于永久性故障时 ， 将带来一些不利的影响 ， 包括 （\nA ． 使电力系统又一次受到故障的冲击\nB ， 使断路器的工作条件变得更加严重 ， 因为它要在很短的时间内 ， 连续切断两次短路电流\nC ， 对油断路器来说 ， 当 ZCH 作用于永久性故障时 ， 其遮断容量也有不同程度的降低\nD ． 对断路器没什么影响","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-19","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":19,"page":64,"text":"下列对重合闸的要求描述正确的是 （\n全国统一服热线 ： 4006781236\nA. 由值班人员手动操作或通过遥控装置将断路器断开时 ZCH 不应动作\nB ． 手动投人断路器 ， 由于线路上有故障 ， 而随即被继电保护将其断开时 ZCH 不应动作 ， 因\n为这是故障为永久性故障\nC 沩了保证供电可靠性 ， ZCH 的动作不应该有延时\nD.ZCH 的动作次数为无限多次","answer":"AB","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-20","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":20,"page":65,"text":"自动重合闸回路由哪几部分构成 ？ （\nA ． 重合闸起动回路\nB ． 重合闸时间元件\nC ， 一次合闸脉冲元件\nD ． 加速元件","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-21","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":21,"page":65,"text":"ZCH 包括 （\nA ， 单相重合闸\nB 三相重合闸\nC 综厶重厶闸\nD ． 以上都不对\n庵 、 口口","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-22","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":22,"page":65,"text":"重合闸要带有一定的时限原因为 （\nA ． 故障点的电弧熄灭并使周围介质绝缘强度恢复需要一定的时间\nB ． 断路器跳闸后 ， 消弧室重新充满油需要一定的时间\nC ． 操作机构恢复原状准备好再次动作需要一定的时间\nD ． 以上都不对","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-23","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":23,"page":65,"text":"重合闸与继电保护的配合包括 （\nA ， 重合闸前加速\nB 重合闸后加速\nC ． 综合重合闸\nD ， 以上都不对","answer":"AB","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-24","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":24,"page":65,"text":"前加速的优点有 （\nA ． 能够快速的切除瞬时性故障\nB ． 可能使瞬时性故障来不及发展为永久性故障 ， 从而提高重合闸的成功率\nC ． 能保证发电厂和重要变电所的母线电压在 0 ． 6 ． 0 ． 7 倍额定电压以上 ， 从而保证厂用电和重\n要用户的电能质量\nD ． 使用设备少 ， 只需装设一套重合闸装置 ， 简单 ， 经济","answer":"ABCD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-25","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":25,"page":65,"text":"后加速的优点有 （\nA ． 第一次有选择性的切除故障 ， 不会扩大停电范围\nB ． 保证了永久性故障瞬时切除 ， 并仍然是有选择性的\nC ． 和前加速相比 ， 使用中不受网络结构和负荷设备的限制\nD ． 第一次切除故障带有延时","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-26","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":26,"page":65,"text":"单相自动重合闸中的选相元件应满足选择性 ， 具体要求是 （\nA ， 发生故障时只跳开发生故障的那一相 ， 而另外两相上的选相元件不应动作\nB ． 只跳开与故障点相近的断路器\nC ， 动作越快越好\nD ． 以上都不对","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-multi-27","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"multi","typeLabel":"多选题","number":27,"page":65,"text":"输电线路三相一次自动重合闸装置的构成元件有 （\nA ． 重合闸起动元件\nB ， 重合闸时间元件\nC ， 一次合闸脉冲元件\nD ． 执行元件","answer":"ABCD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-1","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":1,"page":66,"text":"电力系统的运行经验表明 ， 架空线路故障大部分是瞬时性的故障 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-2","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":2,"page":66,"text":"自动重合闸就是一种当断路器跳闸后 ， 能够将断路器自动重合的装置 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-3","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":3,"page":66,"text":"在高压输电线路采用重合闸可以大大提高系统并列运行稳定性 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-4","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":4,"page":66,"text":"当重合闸重合于永久性故障时 ， 会使电力系统又一次受到故障的冲击 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-5","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":5,"page":66,"text":"由值班人员手动操作或通过遥控装置将断路器断开时重合闸不应动作 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-6","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":6,"page":66,"text":"架空输电线路上发生的故障大部分为瞬时性故障 ， 因此采用自动重合闸的利大于弊 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-7","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":7,"page":66,"text":"“ 前加速 \" 保护的优点是第一次跳闸有选择性的动作 ， 不会扩大事故 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-8","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":8,"page":66,"text":"对输电线路自动重合闸装置的要求有 ： 动作迅速 ， 允许多次重合 ， 手动跳闸不应重合 。","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-9","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":9,"page":66,"text":"三相一次自动重合闸装置通常由启动元件 ， 延时元件 ， 一次合闸脉冲元件等组成 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-10","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":10,"page":66,"text":"自动重合闸与继电保护的配合的方式主要有两种 ： 自动重合闸前加速保护动作 ， 自动\n重合闸后加速保护动作 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c5-judge-11","chapter":5,"chapterTitle":"输电线路自动重合闸的作用和要求","type":"judge","typeLabel":"判断题","number":11,"page" 式比率制动的变压器差动保护 ， 提高灵敏度的方法是 （\nA ． 降低最小启动电流\nB ． 增加拐点电流\nC ． 降低制动比\nD ． 增加最小动作电流","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-32","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":32,"page":85,"text":"以下关于变压器差动保护的说法中正确的是 （\nA ． 属于主保护\nB ． 可以反应油箱外部的所有故障\nC ． 可以反应油箱内部的所有故障\nD ． 不能反应油箱内部的故障","answer":"AB","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-33","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":33,"page":85,"text":"变压器中性点接地原则 ， 从变压器角度看有 （\nA. 自耦变压器中性点直接接地\nB ， 分级绝缘变压器中性点绝缘水平很低的直接接地\nC ， 全绝缘变压器中性点可直接接地 、 可不接地\nD ． 保证运行方式变化时 ， 零序电流大小分布变化较小","answer":"ABCD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-34","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":34,"page":85,"text":"对电流比相式母线保护的工作情况描述正确的是 （\nA ． 当母线不带电时 ， 保护不动作\nB ． 当母线正常运行或外部故障时 ， 保护不动作\nC ． 当母线内部故障时 ， 各连接元件额电流都流向母线 ， 保护动\nD. 以上都不对","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-35","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":35,"page":85,"text":"采用电流牝相式母线保护的特点有哪些 （\nA ． 保护装置的工作原理是基于相位的比较 ， 而与幅值无关因此可以无需考虑不平衡电流\n的影响 ， 这就提高了保护的灵敏性 。\nB ． 当母线连接元件的电流互感器型号不同或变比不一致时 ， 仍然可以使用 ， 这就放宽了母\n线保护的使用条件 。\nC 沩了躲开中间变流器的误差的影响 ， 选择延时回路的时间大于闭锁角所对应的时间\nD ． 这种保护的灵敏性低","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-36","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":36,"page":85,"text":"下列对双母线运行时 ， 母线保护的实现方法说法正确的是 （\nA ． 当母线按照固定连接方式运行时 ， 保护装置可以有选择性的切除发生故障的一组母线 ，\n另一组母线可以继续运行\nB ． 当母线按照固定连接方式破坏时 ， 任一母线上的故障将导致切除两条母线\nC ， 从保护的角度来看 ， 要求母线按照固定连接方式运行 ， 这就限制了电力系统调度的灵活\n性\nD ， 这种保护的调度灵活性好 ， 不受系统运行方式的影响","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-37","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":37,"page":86,"text":"双母线同时运行的联电流相位比较式差动保护中 ， 保护装置的电压闭锁元件为两组低\n电压继电器 ， 其作用为 （\nA ． 在正常运行情况下 ， 低电压继电器均不启动 ， 将保护装置闭锁 ， 可以防止保护误动\nB ， 当母联断路器退出运行时 ， 电压闭锁元件可以作为保护装置的选择元件 ， 选择出发生故\n障的母线\nC ． 低电压继电器的作用可有可无\nD ． 以上都不对","answer":"AB","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-38","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":38,"page":86,"text":"断路器失灵保护要动作于跳开一组母线上的所有断路器 ， 伪防止保护误动 ， 对失灵保\n护的起动提出了附加条件 ， 下列正确是 （\nA ． 故障线路的保护装置出口继电器动作后不返回\nB ． 在保护范围内仍然存在着故障\nC 河以随便动作\nD ． 以上都不对","answer":"AB","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-39","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":39,"page":86,"text":"电力系统中的 “ 瞬时性故障 \" 包括哪些 （\nA 油雷电引起的绝缘子表面闪络\nB ． 大风引起的碰线\nC ． 通过鸟类以及树枝等物掉落在导线上引起的短路等\nD ． 由于线路倒杆而引起的故障","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-40","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":40,"page":86,"text":"关于变压器负序电流保护的说法 ， 正确的是 （\nA ， 对于大容量的变压器应采用负序过电流保护 ， 以提高不对称短路时的灵敏性\nB ． 负序电流保护通过反应变压器不对称故障时出现的负序分量而构成 ， 保护在不对称故障\n时的灵敏度较高 ， 且与变压器的接线方式无关 ， 接线也比较简单\nC ． 与复合电压起动的过电流保护相比 ， 负序电流保护无须引人负序电压 ， 且具有更高的灵\nD ， 负序电流保护不能提高三相短路的灵敏度\n） 和交换功率等功能 。","answer":"ABCD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-41","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":41,"page":86,"text":"变电站是电力系统中联系发电厂与用户的中间环节 ， 具有 （\nA ． 产生电能\nB ． 分配电能\nC ． 变换电压\nD ． 汇集电能","answer":"BCD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-42","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":42,"page":86,"text":"变压器的纵差动保护可以反应 （\nA ． 套管和引出线上的相间短路\nB. 套管和引出线上的接地短路\nC ． 绕组上的相间短路\nD. 绕组上的轻微匝间短路","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-43","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":43,"page":86,"text":"常用的电压互感器接线方式有 （\nA ． 星形接线\nB ． 开口三角形接线\nC ． 两相电流差接线\nD.V-V 接线","answer":"ABD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-44","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":44,"page":86,"text":"电力系统的故障性质可分为 （\nA 泳久性故障\n衡直教育 | 国家电网\nB ， 瞬时性故障\nC ． 电缆故障\nD ， 母线故障","answer":"AB","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-45","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":45,"page":87,"text":"下列关于断路器失灵保护的说法正确的是 （\nA ． 断路器失灵保护是一种后备保护\nB ． 在断路器拒动时动作\nC 河以作为主保护\nD ． 以上都不对","answer":"AB","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-46","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":46,"page":87,"text":"下列关于断路器的说法正确的是 （\nA 河以切断短路电流\nB ． 可以切断负荷电流\nC 洧灭弧装置\nD ． 以上都不对","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-47","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":47,"page":87,"text":"在电力系统中 ， 常用的主接线形式有 （\nA ． 单母线接线\nB ． 单母线分段接线\nC ． 双母线接线\nD ． 双母线带旁路母线接线","answer":"ABCD","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-48","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":48,"page":87,"text":"关于差动速断保护的说法中正确的是 （\nA ． 整定值较大 ， 灵敏性不高\nB ． 不需要涌流闭锁装置\nC ． 整定值较小 ， 灵敏性高\nD ． 需要涌流闭锁装置","answer":"AB","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-49","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":49,"page":87,"text":"当母线发生故障时 《 ， 对电力系统的影响有 （\nA ． 影响供电可靠性\nB 皸坏电力系统的稳定性\nC 洧些用户被迫停电\nD ． 以上都不对","answer":"ABC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-multi-50","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"multi","typeLabel":"多选题","number":50,"page":87,"text":"变压器过电流保护的最大负荷电流取值需要考虑 （\nA ． 对于并列运行的变压器 ， 应考虑突然切除一台时由于负荷转移而出现的过负荷\nB ， 对于并列运行的变压器 ， 应考虑突然切除多台时由于负荷转移而出现的过负荷\nC ． 对降压变压器 ， 应考虑低压侧负荷电动机自启动时的最大电流\nD ． 应考虑夕卜部故障引起的变压器过电流一","answer":"AC","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-1","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":1,"page":87,"text":"瓦斯保护能单虫作为变压器的圭保护 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-2","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":2,"page":87,"text":"变压器纵差保护 ， 是 》 由箱外部故障的一种有效保护方式 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-3","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":3,"page":87,"text":"变压器的差保护是变压器卵主保护 。 ）","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-4","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":4,"page":87,"text":"变压器的重瓦斯保护的出口方式是不能改变的 。 ' （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-5","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":5,"page":87,"text":"为了在正常运行时和外部短路时流人变压器纵差保护的电流为零 ， 因此 ， 该保护两侧应\n选用相同变比的电流互感器 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-6","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":6,"page":87,"text":"变压器的故障可分为内部故障 （ 变压器油箱里面发生的各种故障 ） 和外部故障 （ 变压器\n油箱外部绝缘套管及引出线发生的各种故障 ） 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-7","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":7,"page":87,"text":"变压器的瓦斯保护范围在纵差保护范围内 ， 由于这两种保护均为瞬动保护 ， 所以可用差\n动保护来代替瓦斯保护 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-8","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":8,"page":87,"text":"变压器纵差保护不能反应变压器绕组的匝间短路故障 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-9","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":9,"page":87,"text":"为了检查差动保护躲过励磁涌流的性能 ， 在对变压器进行冲击合闸实验时 ， 必须投人差\n动保护 。 （\n衡直教育 | 国家申 ， 网\n· 4006781236","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-10","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":10,"page":88,"text":"新安装的变压器纵差保护在变压器充电时 ， 应将差动保护停邦 ， 瓦斯保护投人运行 ，\n待测试差动保护极性正确后再投人运行 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-11","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":11,"page":88,"text":"在变压器复合电压起动的过流保护中 ， 加装复合电压元件的目的是为了提高电流元件\n的灵敏度 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-12","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":12,"page":88,"text":"厶变压器在运行中补充油 ， 应事先将重瓦斯保护改接信号位置 ， 以防止误动跳闸 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-13","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":13,"page":88,"text":"变压器励磁涌流的大小与合闸瞬间有关 ， 当电压瞬时值最大时合闸励磁涌流最小 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-14","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":14,"page":88,"text":"变压器中性点间隙接地的接地保护采用零序电流继电器和零序电压继电器串联的方式 ，\n带有 0 巧秒的限时构成 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-15","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":15,"page":88,"text":"变压器的内部故障分为油箱内部故障和油箱外部故障两种 。 （","answer":"A","boundaryInferred":true,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-16","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":16,"page":88,"text":"瓦斯保护应反应变压器油箱内的各种故障以及油面的降低 ， 其中轻瓦斯动作于信号 ，\n重瓦斯动作于跳闸 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-17","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":17,"page":88,"text":"对于变压器绕组 ， 套管及引出线上的故障 ， 应根据容量不同装设纵差保护或电流速断\n保护 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-18","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":18,"page":88,"text":"在变压器的纵差动保护中 ， 要适当的选择两侧电流互感器的变比 ， 使其比值等于变压\n器的变比 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-19","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":19,"page":88,"text":"在变压器的纵差动保护中可以不考虑不平衡电流的影响 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-20","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":20,"page":88,"text":"当变压器空载投人和外部故障电压恢复时 ， 励磁电流很大 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-21","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":21,"page":88,"text":"一般 ， 变压器的励磁涌流可达额定电流 6 · 8 倍 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-22","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":22,"page":88,"text":"变压器的励磁涌流中含有大量的高次谐波 ， 其中以五次谐波为主 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-23","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":23,"page":88,"text":"当变压器纵联差动保护采用了二次谐波制动 、 间断角等原理识别励磁涌流时 ， 就已经\n具有了躲开励磁涌流的性能 ， 所以定值可不考虑躲过励磁涌流 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-24","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":24,"page":88,"text":"双绕组变压器差动保护的正确接线 ， 应该是正常及外部故障时 ， 高 、 低産侧二次电流\n相位相同 ， 流人差动继炮器差动线圈的电流为变压器高 、 低压侧匕次电流之相量和 。 〖","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-25","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":25,"page":88,"text":"当两侧电流互感器型号不同时 ， 同型系数应取 0 ． 5p （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-26","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":26,"page":88,"text":"变压器枞差保护保护的灵敏系数校验时应为系统在最大运行方式下 ， 变压器发生短路\n为\n时的最大短路电流 。 还","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-27","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":27,"page":88,"text":"具有制动特性的差动继电器可以在内部故障时提高保护的灵敏性 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-28","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":28,"page":88,"text":"在双绕组变压器差动保护的接线中 ， 制动线圈应接于无电源或小电源的一侧 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-29","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":29,"page":88,"text":"具有比率制动的差动继电器接线中 ， 继电器的动作电流随着制动电流的增大而增大 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-30","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":30,"page":88,"text":"瓦斯保护的优点是动作迅速 ， 灵敏度高 ， 安装接线简单 ， 能反应油箱内部发生的各种\n故障 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-31","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":31,"page":88,"text":"变压器不正常工作状态主要包括 ： 油箱里面发生的各种故障和油箱外部绝缘套管及其\n引出线上发生的各种故障 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-32","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":32,"page":88,"text":"变压器内部故障系指变压器线圈内发生故障 。 （\n衡直教育 | 国家电网\n全国统一服务热纰 4006781236","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-33","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":33,"page":89,"text":"220kv 及以上电压等级变压器配置两套独立完整的保护 （ 含非电量保护 ） ， 以满足双重化\n原则 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-34","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":34,"page":89,"text":"变压器气体继电器的安装 ， 要求变压器顶盖沿气体继电器方向与水平面具有 1 ％ ～ 巧 ％\n的升高坡度 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-35","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":35,"page":89,"text":"新安装的变压器 ， 在投人运行前应将重瓦斯保护改接信号位置 ， 以防止误动跳闸 。","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-36","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":36,"page":89,"text":"瓦斯保护能反应变压器油箱内的任何故障 ， 如铁芯过热烧伤及油面降低等 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-37","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":37,"page":89,"text":"变压器瓦斯保护可以保护变压器内部和变压器引出线之间的短路故障 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-38","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":38,"page":89,"text":"带负荷调压的油浸式变压器的调压装置 ， 亦应装设瓦斯保护 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-39","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":39,"page":89,"text":"在变压器高压侧引线单相接地故障时 ， 单相短路电流导致变压器油热膨胀 ， 从而使瓦\n斯保护动作跳闸 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-40","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":40,"page":89,"text":"当变压器发生少数绕组匝间短路时 ， 匝间短路电流很大 ， 因而变压器瓦斯保护和各种\n类型的变压器差动保护均动作跳闸 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-41","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":41,"page":89,"text":"0 ． 8MVA 及以上油浸式户外变压器 ， 应装设瓦斯保护 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-42","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":42,"page":89,"text":"变压器瓦斯保护是防御变压器油箱内各种短路故障和油面降低的保护 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-43","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":43,"page":89,"text":"变压器纵差保护经星 · 三角形相位衤卜偿后 ， 滤去了故障电流中的零序电流 ， 因此不能反","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-44","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":44,"page":89,"text":"映变压器侧内部单相接地故障 。 （\n啊 、 变压器励磁涌流的大小与合闸瞬间有关 ， 当电压瞬时值为零时合闸励磁涌流最小 。","answer":"B","boundaryInferred":true,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-45","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":45,"page":89,"text":"为防止变压器差动保护在变压器过励磁时误动 ， 在确定保护的整定值时 ， 应减小 5 次\n谐波制动比 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-46","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":46,"page":89,"text":"变压器差动保护 （ 包括无制动的差动速断部分 ） 应能躲过励磁涌流和外部故障的不平\n衡电流 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-47","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":47,"page":89,"text":"只要变压器的绕组发生了匝间短路 ， 差动保护就一定能动作 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-48","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":48,"page":89,"text":"差动保护能够代替瓦斯保护 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-49","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":49,"page":89,"text":"变压器各侧电流互感器型号不同 ， 互感器变比与计算值不同 ， 变压器调压分接头不同 ，\n所以在变压器差动保护中会产生暂态不平衡电流 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-50","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":50,"page":89,"text":"母线的完全电流差动保护是基于 KCL 构造的 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-51","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":51,"page":89,"text":"母线完全电流差动保护对所有连接原件上装设的电流互感器的变比相等 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-52","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":52,"page":89,"text":"电流相位比较式母线保护的工作原理是根据母线外部故障或内部故障时连接在该母线\n上各电流元件相位的变化来实现的 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-53","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":53,"page":89,"text":"电流比相式母线保护只与电流的相位有关 ， 而与电流的幅值无关 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-54","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":54,"page":89,"text":"母线完全电流差动保护是在母线的所有连接元件上装设专用的电流互感器 ， 而且这些\n电流互感器的变比和特性完全相同 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-55","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":55,"page":89,"text":"重合闸启动元件的作用是当断路器跳闸后 ， 使重合闸的延时元件启动 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-56","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":56,"page":89,"text":"一般来说在中低压系统中不装设专门的母线保护 ， 而是利用供电元件的保护装置把母\n丿\n线故障切除 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-57","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":57,"page":90,"text":"为了保证选择性和速动性 ， 一般 ， 母线保护是按照差动原理构成的 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-58","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":58,"page":90,"text":"在母线保护中 ， 从连接元件的电流的相位来看 ， 当母线内部发生故障时 ， 元件中电流\n的相位是相同的 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-59","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":59,"page":90,"text":"在母线保护中 ， 从连接元件的电流的相位来看 ， 当母线外部发生故障时 ， 元件中电流\n的相位是相反的 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-60","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":60,"page":90,"text":"在完全电流差动保护中 ， 要求母线的连接元件中装设特性相同的电流互感器 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-61","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":61,"page":90,"text":"母线充电保护只是在对母线充电时才投人使用 ， 充电完毕后要退出 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-62","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":62,"page":90,"text":"元件固定连接的双母线差动保护装置 ， 在元件固定连接方式破坏后 ， 如果电流二次回\n路不做相应切换 ， 则选择元件无法保证动作的选择性 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-63","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":63,"page":90,"text":"对于超高压系统 ， 当变电站母线发生故障 ， 在母差保护切除故障的同时 ， 变电站出线\n端的线路保护亦应可靠的跳开三相断路器 。 （","answer":"A","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-64","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":64,"page":90,"text":"为了使用户的停电时间尽可能短 ， 自动重合闸装置可以不带时限 。 （","answer":"B","boundaryInferred":false,"subject":"relay","options":["A","B","C","D"]},{"id":"c6-judge-65","chapter":6,"chapterTitle":"变压器、母线的主要故障类型、保护配置和特殊问题","type":"judge","typeLabel":"判断题","number":65,"page":90,"text":"母差保护与失灵保护共用出口回路 。 （","answer" d":false},{"id":"hv-c2-single-50","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"single","typeLabel":"单选题","number":50,"page":20,"text":"测量电气设备绝缘电阻时 ， 电流会有一个缓慢的 、 较长时间的衰减过程 ， 原因是有 （\nA ， 传导电流\nB ． 吸收电流\nC ． 电容电流\n） 表示 。\nD ， 泄漏电流","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-single-51","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"single","typeLabel":"单选题","number":51,"page":20,"text":"1 、 衡量电介质损耗的大小用 （\nA ． 相对电介质\nB ． 电介质电导\nC ． 电介质极化\nD ． 介质损失角正切","answer":"D","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c2-single-52","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"single","typeLabel":"单选题","number":52,"page":20,"text":"电力系统外绝缘的雷电冲击耐压试验采用巧次冲击法 （ 时间间隔不少于 lmm ） ， 若击\n穿或闪络数不超过 （\n） 次 ， 即可认为该外绝缘试验合格 。\nC.3\nD ． 4\n） 的交流高压 。","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-single-53","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"single","typeLabel":"单选题","number":53,"page":20,"text":"电阻分压器可以测 （\n扫描全能王\n3 亿人都在用的归韉 App\nA ． 小于 150kv\nB ． 小于 300kV\nC. 小于 100kV\nD ． 小于 200kV\n） 是电气检测方法 。","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-single-54","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"single","typeLabel":"单选题","number":54,"page":21,"text":"在检测和分析局部放电 （ PD ） 时 ， 以下 （\nA 气相色谱分析\nB ， 光学检测\nC ． 超高频法\nD ． 超声波法","answer":"C","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-1","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":1,"page":21,"text":"以下关于兆欧表的说法正确的是 （\nA ． 兆欧表 （ 摇表 ） 分为 500V 、 ] 000V 、 2500v 和 5000V 四种\nB ． 低压设备使用 500v 和 1000V 的兆欧表\nC ． 兆欧表有三个接线端钮 ， 分别标有 L （ 线路 ） 、 E （ 屏蔽 ） 和 G 〔 接地 ）\nD ． 高压设备使用 2500v 和 5000V 的兆欧表","answer":"ABD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-2","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":2,"page":21,"text":"以下关于绝缘电阻 、 吸收比和极化指数的说法正确的是 （\nA ． 绝缘电阻是一切电介质和绝缘结构的绝缘状态最基本的综合性参数\nB ． 吸收电流按指数规律衰减完毕后所测得的稳态电阻值为该试品的绝缘电阻\nC ． 吸收比是加压 60s 时测得的绝缘电流值与巧时测得的电流值的比值\nD ， 在容量大 、 电压高的电力变压器和电机中采用极化指数反映其绝缘性能\n） 才能保证国家标准规定的测量不确定度 。","answer":"ABD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-3","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":3,"page":21,"text":"用铜球间隙测量高电压 ， 需满足 （\nA ． 铜球距离与铜球直径之比不大于 0 ． 5\nB ． 结构和使用条件必须符合的规定\nC ． 需进行气压和温度的校正\nD ， 应去除灰尘和纤维的影响","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-4","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":4,"page":21,"text":"下面的选项中 ， 非破坏性试验包括 （\nA ． 绝缘电阻试验\nB 局部放电试验\nC ． 绝缘油的气相色谱分析\nD ． 介质损耗角正切试验","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-5","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":5,"page":21,"text":"下面的选项中 ， 绝缘油的气相色谱分析说法正确的是 （\nA ． 电弧放电的电流大 ， 变压器油主要分解出 C2H2 、 H2 及较少的 CH4\nB ． 局部放电的电流较小 ， 变压器油主要分解出和\nC ． 变压器油受潮时分解出 1-12\nD ， 纸和某些绝缘材料过热时 CO 和 C02 含量增加","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-6","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":6,"page":21,"text":"关于输电线路绝缘子串的电压分布 ， 说法正确的是 （\nA ． 电压分布呈 U 形曲线\nB ， 靠近导线侧的绝缘子片承受电压最小\nC ． 表面比较清洁时 ， 电压分布规律取决于绝缘结构本身的电容和杂散电容\nD ． 表面污染受潮时 ， 电压分布规律取决于表面电导","answer":"ACD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-7","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":7,"page":21,"text":"关于变压器的感应耐压试验 ， 说法错误的是 （\nA ． 感应耐压试验主要考察绕组的主绝缘\nB ． 一般在高压侧施加 2 倍的额定电压\n扫描全能王\n3 亿人都在用的归韉 App\nC ． 试验电压的频率为工频的一半\nD ． 感应耐压试验会造成变压器铁芯饱和 ， 因此尽量避免该试验","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-8","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":8,"page":22,"text":"关于测量用的球隙 ， 下面表述正确的是 （\nA ． 球隙不必串联保护电阻\nB ． 用球隙测量直流电压时 ， 测量效果不如棒一棒间隙\nC 在测量冲击电压时串联的电阻不超过 500Q\nD ． 测量球隙的球隙距离 d 与直径 D 之比小于等于 0 ． 5","answer":"BCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-9","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":9,"page":22,"text":"关于预防性试验 ， 以下说法正确的是 （\nA ． 测量泄漏电流的方法有微安表直读法\nB ． 测量绝缘电阻一般用兆欧表\nC ． 测量损耗角正切值的方法有西林电桥\nD ， 测量吸收比用兆欧表","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-10","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":10,"page":22,"text":"属于局部放电试验中电的测量方法的有 （\nA ． 脉冲电流法\nB ． 介质损耗法\nC ， 光检测法\nD ． 噪声检测法","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-11","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":11,"page":22,"text":"属于局部放电试验中非电的测量方法的有 （\nA ． 射频检测法 、 无线电干扰电压法 、 超高频检测法\nB ． 化学分析法\nC ． 光检测法\nD ． 噪声检测法","answer":"BCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-12","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":12,"page":22,"text":"关于兆欧表 ， 说法正确的是 （\nA ． 兆欧表的刻度不均匀\nB ． 兆欧表不用的时候 ， 指针停在 0 的位置\nC ， 兆欧表输出的是直流电压一\nD ， 兆欧表的采用了流比计测量原理","answer":"ACD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-13","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":13,"page":22,"text":"获得交流高电压的试验设备主要有\nA ， 冲击电压发生器\nB ． 高压试验变压器\nC ， 高压试验变压器的串级结构\nD ． 串联谐振电路","answer":"BCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-14","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":14,"page":22,"text":"以下关于高压试验变压器特点的说法正确的是 （\nA ． 绝缘强度高 ， 绝缘裕度小\nB ． 容量较小 ， 体积小\nC ． 漏阻抗大 ， 短路电梳小\nD ． 运行时间短 ， 发热量小","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-15","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":15,"page":22,"text":"若对某变压器进行 tan 测量 ， 下列说法正确的是 （\nA ， 现场多采用自动介损测试仪测量\nB ． 测量时应将每个绕组首尾短接\nC ， 测量在 20 、 30 ℃ 测量\nD ． 被试品一端接地 ， 要用反接法测量","answer":"ABD","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c2-multi-16","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":16,"page":22,"text":"试验室测量冲击高电压的方法有 （\nA ． 球隙法\nB ， 分压器一峰值电压表法\nC ， 分压器一示波器法\nD ． 分压器一静电电压法","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-17","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":17,"page":22,"text":"试验室测量直流高电压的方法有 （\nA ． 高压高阻法\nB ． 旋转电位计\nC ， 静电电压表\nD ． 标准棒一棒间隙 ， 标准球间隙\n扫描全能王\n3 亿人都在用的归韉 App","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-18","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":18,"page":23,"text":"试验室测量工频高电压的方法有 （\nA ． 球间隙\nB ． 峰值电压表\nC ． 静电电压表\nD ． 分压器配用低压仪表","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-19","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":19,"page":23,"text":"以下会引起球隙测量电压不准确的因素有 （\nA ， 球面的尘污\nB ． 球隙间空气游离不充分\nC 湘邻两次间隔时间小于 1 皿 n\nD ． 金属球曲率不均匀","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-20","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":20,"page":23,"text":"常用的电压分压器分类有 （\nA ． 电阻分压器\nB · 电容分压器\nC ， 阻容串联分压器\nD ． 阻容并联分压器","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-21","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":21,"page":23,"text":"用兆欧表测量绝缘电阻时 ， 接线方式为 （\nA 线路端子 L 接于被试设备的高压导体上\nB ． 被试品接在和 E 端之间\nC ． 屏蔽端子 G 接于被试设备的高压屏蔽环 / 罩上 ， 以消除表面泄漏电流的影响\nD ． 不需要屏蔽端子 G","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-22","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":22,"page":23,"text":"高压试验变压器调压时的基本要求 （\nA ． 电压应该平滑地调节\nB ． 调压器应在试验变压器的输人端提供从零到额定值的电压\nC ． 调压器的容量应不小于试验变压器的容量\nD ． 在有滑动触头的调压器中 ， 不应该发生火花","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-23","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":23,"page":23,"text":"冲击电压发生器基本回路原理图中的元件有主电容 、 波前电容 ， 以及波前电阻和波尾\n电阻 ， 为了获得一很快由零土升到峰值然后较慢下降的 ． 冲击轩压 ． ， 应使 （\nA ， 波前电阻大于波尾电阻\nB ． 波前电阻小于波尾电阻\nC ． 主电容大于波前电容\nD ． 主电容小于波前电容","answer":"BC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-24","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":24,"page":23,"text":"直流耐压试验与交流相比主要特点是 （\nA ， 试验设备容量小 ， 重量轻 ， 便于现场试验\nB ， 可同时进行泄漏电流测量\nC ． 对绝缘损伤小\nD ． 对交流电气设备绝缘的考验不如交流耐压试验接近实际","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-25","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":25,"page":23,"text":"表征局部放电的参数有 （\nA ． 视在放电量\nB ． 放电重复率\nC · 放电能量\nD ， 平均放电电流","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-26","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":26,"page":23,"text":"用球隙测量交直流电压时 ， 关于串接保护电阻的说法 ， 错误的是 （\nA ． 球隙必须串有较大阻值的保护电阻\nB ． 串接电阻越大越好\nC ， 一般规定串联的电阻不超过 5000\nD ， 放电时间很短 ， 不需要串接电阻来保护球面\n扫描全能王\n3 亿人都在用的归韉 App","answer":"BCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-27","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":27,"page":24,"text":"局部放电的特点正确的有 （\nA ． 放电能量很小 ， 短时间内存在不影响电气设备的绝缘强度\nB 、 对绝缘的危害是逐渐加大的 ， 它的发展需要一定时间一累积效应一缺陷扩大一绝缘击穿\nC 局部放电试验属破坏性试验 ， 会造成绝缘损伤\nD ． 绝缘中的局部放电不会引起电介质老化","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-28","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":28,"page":24,"text":"绝缘试验可分为 （\nA ． 非破坏性试验\nB ． 破坏性试验\nC ． 检测试验\nD ． 投人试验","answer":"AB","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-29","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":29,"page":24,"text":"关于以下直流高电压试验特点说法正确的有 （\nA ， 加压时间需较长时间 ， 一般 5 一 10 分钟 ， 有些需要巧分钟\nB ． 泄漏电流为微安级 ， 直流试验设备容量大 、 重量轻\nC ， 直流高压下 ， 局部放电弱 ， 破坏性弱\nD 咬流设备作直流耐压试验需较高电压等级 ， 才能具有等效性","answer":"ACD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-multi-30","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"multi","typeLabel":"多选题","number":30,"page":24,"text":"关于绝缘电阻的测量 ， 说法正确的是 （\nA ． 高电压大容量被试品用吸收比的测试代替极化指数的测试\nB ． 为了避免被试品可能存留的残余电荷的影响 ， 测试前被试品应对地放电\nC ． 对于多层的绝缘 ， 直流电压下有明显的吸收现象\nD ， 为了消除表面泄漏电流的影响 ， 需要使用 E 端子","answer":"BC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-1","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":1,"page":24,"text":"测量 t 5 值是判断电气设备绝缘状态的一项灵敏有效的方法 ， 主要用来检测局部性缺陷 。","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-2","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":2,"page":24,"text":"测量电气设备的绝缘电阻时一般要加直流电压 ， 绝缘电阻与温度没有关系 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-3","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":3,"page":24,"text":"5 测量过程中可能受到电场干扰和磁场干扰 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-4","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":4,"page":24,"text":"脉冲电流法测试局部放电时 ， 若试品接地 ， 则一般用并联测试回路 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-5","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":5,"page":24,"text":"在进行泄漏电流试验时 ， 记下不同电压等级下的泄漏电流值并画成曲线 ， 根据曲线的形\n状可判断缺陷的类型 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-6","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":6,"page":24,"text":"绝缘子瓷体内的裂缝 、 发电机定子绝缘因挤压磨损而出现的局部破损 、 电缆绝缘层内存\n在的气泡等 ， 属于集中性缺陷 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-7","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":7,"page":24,"text":"泄漏电流测量使用正极性的直流电压 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-8","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":8,"page":24,"text":"液体电介质中纤维对击穿电压的影响比碳粒对击穿电压的影响大 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-9","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":9,"page":24,"text":"泄漏电流 、 绝缘电阻 、 介质损耗角正切都是在直流电压下测量 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-10","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":10,"page":24,"text":"对于现场被动接地的设备 ， 采用西林电桥测介质损耗角正切时 ， 要采用反接线 。 （\n1 1 、 兆欧表电压较低 ， 不能使集中性缺陷发生放电 ， 因此 ， 测绝缘电阻不能有效发现集中","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-11","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":11,"page":24,"text":"性缺陷 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c2-judge-12","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":12,"page":24,"text":"测定电气设备的在不同电压强度下的局部放电放电强度和发展趋势 ， 就能判断绝缘内\n扫描全能王\n3 亿人都在用的归韉 App\n是否存在局部缺陷以及介质老化的速度和目前的状态 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-13","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":13,"page":25,"text":"与非破坏性试验相比 ， 绝缘的高电压试验具有直观 、 可信度高 、 要求严格等特点 ， 但\n因它具有破坏性的性质 ， 所以一般都放在非破坏性试验项目合格通过之后进行 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-14","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":14,"page":25,"text":"测量直流和交流电压时 ， 测量球隙需要串联保护电阻 ， 被测电压越大 ， 相应的保护电\n阻阻值应越大 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-15","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":15,"page":25,"text":"一般来讲 ， 都将绝缘的高电压试验放在非破坏性试验项目合格通过之后进行 ， 以避免\n或减少不必要的损失 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c2-judge-16","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":16,"page":25,"text":"西林电桥测介质损耗角正切时 ， 测量结果就是可调电阻的阻值 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-17","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":17,"page":25,"text":"双套管试验变压器中 ， 高压绕组的中点通常与外壳相连 ， 每个套管承受的电压仅为输\n出额定电压的一半 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-18","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":18,"page":25,"text":"进行工频交流耐压试验时 ， 升压应从零开始 ， 不可冲击合闸 ， 但对升压速度没有要求 。","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-19","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":19,"page":25,"text":"当所需产生的工频试验电压很高时 ， 采用单台试验变压器来实施 ， 在技术和经济上不\n合理 ， 可以用多台试验变压器组成串级装置产生交流高压 “ （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-20","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":20,"page":25,"text":"电介质的电导率随温度升高而降低 ， 测量时需要记录温度 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-21","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":21,"page":25,"text":"如果输电线路采用钢化玻璃的绝缘子片 ， 则必须绝缘子串的测电压分布 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-22","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":22,"page":25,"text":"局部放电试验测的是 “ 视在放电量 \" ， 不是发生局部放电处的 “ 真实放电量 \" 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-23","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":23,"page":25,"text":"在选定的时间间隔内测得的每秒发生放电脉冲的平均次数 ， 表示局部放电的出现频率 ，\n与外加电压的大小无关 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-24","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":24,"page":25,"text":"直流耐压试验一般施加负极性的电压 。 （","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-25","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":25,"page":25,"text":"直流耐压试验加压时间需较长时间 ， 完成绝缘中的极化和吸收 ， 电压分布才趋于稳定 ，\n故一般采用 1 min 试验 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-26","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":26,"page":25,"text":"对于绝大多数组合绝缘来说 ， 在直流电压下的电气强度远低于在交流电压下 ， 故交流\n设备做直流耐压试验需用较低电压等级 ， 才能具有等效性 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-27","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":27,"page":25,"text":"对于变压器和电抗器类设备的内绝缘 ， 还要再进行雷电冲击截波 （ 1.2 / 2 ～ 5 斡 ） 耐压试\n验 ， 考验主绝缘 。","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-28","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":28,"page":25,"text":"被试品 （ 如电力电缆 、 电力电容器 ） 电容较大时 ， 用工频高电压试验代替直流高电压\n试验 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-29","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":29,"page":25,"text":"对于电容量较大的试品 ， 测量能有效地发现局部集中性缺陷和整体分布性缺陷 。\n但对电容量较小的试品 （ 例如大中型发电机 、 变压器 、 电力电缆 、 电力电容器等 ） 测量 5\n只能发现整体分布性缺陷 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-30","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":30,"page":25,"text":"测量绝缘的介质损耗角正切时 ， 如果当电压大于某个值 ， 测量值突然增大 ， 则说明介","answer":"B","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-31","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":31,"page":25,"text":"质整体受潮 。 （\n3 1 、 不均匀的绝缘试品 ， 如果绝缘严重受潮 ， 则吸收比 K 将远小于 1 。 （","answer":"B","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c2-judge-32","subject":"high-voltage","chapter":2,"chapterTitle":"电气设备绝缘试验","type":"judge","typeLabel":"判断题","number":32,"page":25,"text":"测量绝缘电阻对贯穿性导电通道绝缘缺陷较灵敏 。 〈","answer":"A","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c2-judge-33","subj 压折射系数 2/n\nB ． 各出线电压幅值为 2U/n\nC ． 彼得逊等值电路中等值电压电源为 2U\nD ， 彼得逊等值电路中等值电阻是 Z+Z/ （ n-l ）","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c3-multi-11","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":11,"page":33,"text":"波传播时 ， 经过与导线串联的电感 ， 以下说法正确的是 （\nA. 前行波电压和电流都由强制分量 、 自由分量组成\nB ． 无穷长直角波通过集中电感时 ， 波头被拉长\nC 当波到达电感瞬间 ， 电感相当于开路 ， 使电感前电压升高一倍 ， 然后按指数规律变化\nD. 当时 ， 电感相当于短路 ， 折 、 反射系数与无电感时一样","answer":"ABCD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c3-multi-12","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":12,"page":33,"text":"波传播时 ， 经过联接在导线与地之间的电容 ， 以下说法正确的是 （\nA ， 折射电压 、 电流均由零值按指数规律渐趋稳态值 ， 直角波变为指数波\nB ， 波头变短 ， 陡度增大\nC ． 稳态值只决定于波阻抗乙与 ， 与电容 c 无关\nD ， 在直角波作用下 ， 当 t 时 ， 电容不再起任何作用","answer":"ACD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c3-multi-13","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":13,"page":33,"text":"波在电机绕组中传播时 ， 与在输电线路上的传播过程所不同的是 （\nA ． 存在着较小的铁损 、 铜损\nB ． 随着波的传播 ， 波将较慢地衰减和变形\n． 波到达中性点并再返回日幅值已衰减很小了 ， 其陡度也已极大地变缓\nD 河认为最大纵向电位差主要是前行电压波造成的 ， 出现在绕组首端","answer":"CD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c3-multi-14","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":14,"page":33,"text":"下列属于减弱变压器绕组的振荡的措施的是 （\nA ． 采用静电屏\nB ． 采用静电匝\nC ． 采用均压环\nD ． 变压器采用纠结式绕组","answer":"ABD","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c3-multi-15","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":15,"page":33,"text":"旋转电机绕组中的波过程 （\nA ． 通常所说的波阻抗 、 波速只是槽内外的平均值\nB ． 纵向电磁耦合都比较弱 ， 可略去匝间电容的影响\nC ． 若在直角波作用下 ， 对中性点不接地的发电机 ， 在中性点处最大对地电位可达首端电压\n的两倍\nD 沩使一般电机的匝间绝缘不致损坏 ， 应将侵人波的陡度限制在 10kV / 斡以下","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c3-multi-16","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":16,"page":33,"text":"当冲击电压作用于变压器绕组时 ， 在变压器绕组内将出现振荡过程 ， 出现振荡的根本\n原因是 （\nA ． 由于变压器的稳态电位分布与起始电位分布不同\nB ． 由于变压器的稳态电位分布与起始电位分布相同\nC ． 绕组电感和电容之间存在能量转换\n扫描全能王\n3 亿人都在用的归韉 App","answer":"AC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c3-multi-17","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":17,"page":34,"text":"D 绕组电感和电容之间不存在能量转换\n1 7 、 无穷长直角波 UO 人侵变压器单相绕组时 ， 以下说法正确的是 （\nA ． 绕组末端是否接地 ， 直接影响在绕组上起始电位分布\nB 床端不接地时 ， 绕组稳态电压分布是均匀的\nc 床端接地时 ， 最大电位将出现在绕组首端 1 / 3 附近 ， 其值可达 1.4Uo 左右\nD ． 末端不接地时 ， 绕组中最大电位将出现在中性点附近 ， 其值可达 1.9Uo 左右","answer":"CD","options":["A","B","C","D"],"boundaryInferred":true},{"id":"hv-c3-multi-18","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":18,"page":34,"text":"无穷长直角波人侵变压器单相绕组时 ， 以下说法正确的是 （\nA ． 绕组中的电压起始分布很不均匀 ， 其不均匀程度与值有关\nB.al 愈大 ， 电压起始分布越不均匀 ， 电压分布曲线下降愈慢\nC ． 大部分电压降落在首端 ， 在 x=0 处有最大电位梯度\nD ． 截波作用下 ， 绕组内的最大电位梯度比全波作用时大 ， 而危及绕组的主绝缘","answer":"AC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c3-multi-19","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":19,"page":34,"text":"变压器绕组主绝缘和纵绝缘的论述正确的是 （\nA ． 主绝缘主要由绕组中各点的最大对地电位决定\nB ． 纵绝缘主要由绕组中各点的最大电位梯度决定\nC ， 绕组首端的纵绝缘应重点加强\nD ． 绕组末端的纵绝缘应重点加强","answer":"ABC","options":["A","B","C","D"],"boundaryInferred":false},{"id":"hv-c3-multi-20","subject":"high-voltage","chapter":3,"chapterTitle":"输电线路和绕组中的波过程","type":"multi","typeLabel":"多选题","number":20,"page":34,"text":"关于变压器绕组之间的波过程 ， 以下说法正确的是 （\nA ． 当过电压侵人变压器某一绕组时 ， 除了在该绕组产生振荡过电压外 ， 由于绕组之间的静\n电感应 （ 耦合 ） 、 电磁感应 （ 耦合 ） ， 在变压器其它绕组上也会出现感应 （ 耦合 ） 过电压\nB ． 在某些条件下 ， 变压器绕组之间的感应过电压可能超过电气设备的绝缘水平 ， 造成绝缘\n击穿事故\nC ， 电磁分量与变比有关 ， 电磁分量的数值与绕组的接线方式 、 来波相数等无关\nD ． 静电耦合分量决定于高低压绕组之间的互电容 、 低压绕组对地电容及人射波的陡度等","answer":"ABD","options":["A","B","C","D"],"boundaryInferred":
